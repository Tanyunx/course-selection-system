<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线选课系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M8 21.5 16 9l8 12.5H8z' fill='%23fff'/%3E%3C/svg%3E" />
  <style>
/* =============================================================
   在线选课系统 样式表
   设计原则：简洁、清晰、反馈及时；桌面与移动端响应式；
   遵循 WCAG 2.1 AA：可键盘操作、焦点态清晰、状态不以颜色为唯一表达。
   ============================================================= */

:root {
  --bg: #f2f4f8;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #101828;
  --text-2: #475467;
  --muted: #98a2b3;

  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-soft: #eff4ff;

  --green: #079455;
  --green-soft: #ecfdf3;
  --amber: #b54708;
  --amber-soft: #fffaeb;
  --red: #b42318;
  --red-soft: #fef3f2;
  --purple: #6941c6;
  --purple-soft: #f4f3ff;
  --gray-soft: #f2f4f7;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.16);
  --topbar-h: 58px;
  --sidebar-w: 218px;
}

* { box-sizing: border-box; }

/* hidden 属性必须优先于类选择器：
   [hidden] 的 UA 样式是优先级极低的 display:none，会被 .field / .layout / .login-page
   这类设置了 display 的类规则覆盖，导致"隐藏"失效（登录页与应用框架同时显示、
   验证码区一直可见却从未加载题目）。此处统一兜底。 */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.35; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: var(--primary); text-decoration: none; }

:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ---------------- 通用组件 ---------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: #fff;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--gray-soft); border-color: var(--muted); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }

.btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #912018; border-color: #912018; }

.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover:not(:disabled) { background: var(--gray-soft); border-color: transparent; }

.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn-block { width: 100%; height: 40px; font-size: 14px; }

.icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-2);
  font-size: 16px;
  cursor: pointer;
}
.icon-btn:hover { background: var(--gray-soft); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid transparent;
  white-space: nowrap;
}
.badge::before { content: "●"; font-size: 8px; line-height: 1; }
.badge.no-dot::before { content: none; }

.badge-green { background: var(--green-soft); color: var(--green); border-color: #abefc6; }
.badge-blue { background: var(--primary-soft); color: var(--primary-dark); border-color: #c7d7fe; }
.badge-amber { background: var(--amber-soft); color: var(--amber); border-color: #fedf89; }
.badge-red { background: var(--red-soft); color: var(--red); border-color: #fecdca; }
.badge-purple { background: var(--purple-soft); color: var(--purple); border-color: #d9d6fe; }
.badge-gray { background: var(--gray-soft); color: var(--text-2); border-color: var(--border); }

.tag {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 4px;
  background: var(--gray-soft);
  color: var(--text-2);
  font-size: 12px;
  border: 1px solid var(--border);
}

/* ---------------- 登录页 ---------------- */

.login-page {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  min-height: 100vh;
}

.login-brand {
  background: linear-gradient(150deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
  color: #fff;
  display: flex;
  align-items: center;
  padding: 56px;
  position: relative;
  overflow: hidden;
}
.login-brand::after {
  content: "";
  position: absolute;
  right: -120px; bottom: -160px;
  width: 460px; height: 460px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .08);
}
.login-brand-inner { position: relative; max-width: 460px; }
.brand-mark {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: rgba(255, 255, 255, .18);
  border: 1px solid rgba(255, 255, 255, .35);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700;
  margin-bottom: 22px;
}
.login-brand h1 { font-size: 30px; letter-spacing: .5px; }
.brand-sub { margin-top: 10px; color: rgba(255, 255, 255, .82); font-size: 15px; }
.brand-points { margin-top: 34px; display: grid; gap: 14px; }
.brand-points li { color: rgba(255, 255, 255, .8); font-size: 13px; padding-left: 16px; position: relative; }
.brand-points li::before {
  content: ""; position: absolute; left: 0; top: 8px;
  width: 6px; height: 6px; border-radius: 50%; background: #93c5fd;
}
.brand-points li span {
  display: inline-block; min-width: 70px; margin-right: 8px;
  color: #fff; font-weight: 600;
}

.login-form-wrap { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
.login-form { width: 100%; max-width: 372px; }
.login-form h2 { font-size: 22px; }
.login-tip { margin-top: 6px; color: var(--text-2); font-size: 13px; }

.field { display: block; margin-top: 18px; }
.field-label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-2); }
.field input {
  width: 100%; height: 40px; padding: 0 12px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit; color: var(--text);
  background: #fff;
}
.field input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }

.captcha-row { display: flex; gap: 10px; }
.captcha-question {
  flex: none; min-width: 120px; height: 40px; padding: 0 12px;
  border: 1px dashed var(--border-strong); border-radius: var(--radius-sm);
  background: var(--panel-2); color: var(--text-2); font-size: 14px; cursor: pointer;
  font-family: inherit;
}

.login-error {
  margin-top: 14px; padding: 9px 12px;
  background: var(--red-soft); border: 1px solid #fecdca; border-radius: var(--radius-sm);
  color: var(--red); font-size: 13px;
}

.login-form .btn-block { margin-top: 22px; }

.demo-accounts { margin-top: 26px; padding-top: 18px; border-top: 1px dashed var(--border); }
.demo-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.demo-list { display: flex; flex-wrap: wrap; gap: 8px; }
.demo-list button {
  height: 28px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 999px;
  background: #fff; color: var(--text-2); font-size: 12px; cursor: pointer; font-family: inherit;
}
.demo-list button:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

/* ---------------- 主布局 ---------------- */

.layout { display: flex; flex-direction: column; height: 100vh; }

.topbar {
  flex: none;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 14px;
  padding: 0 18px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  z-index: 30;
}
.menu-toggle { display: none; }
.logo { display: flex; align-items: center; gap: 9px; }
.logo-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px;
}
.logo-text { font-weight: 600; font-size: 15px; }

.term-chip {
  margin-left: 6px;
  padding: 3px 11px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary-dark);
  font-size: 12px;
  border: 1px solid #c7d7fe;
}

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.badge-dot {
  position: absolute; top: 2px; right: 0;
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: var(--red); color: #fff;
  font-size: 10px; line-height: 16px; text-align: center; font-weight: 600;
}

.user-chip { display: flex; align-items: center; gap: 9px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary-soft); color: var(--primary-dark);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px;
}
.user-meta { display: flex; flex-direction: column; line-height: 1.25; }
.user-meta strong { font-size: 13px; font-weight: 600; }
.user-meta em { font-style: normal; font-size: 11px; color: var(--muted); }

.body { flex: 1; display: flex; min-height: 0; }

.sidebar {
  flex: none; width: var(--sidebar-w);
  background: #fff;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 12px 10px;
  overflow-y: auto;
}
.side-group-title {
  padding: 12px 10px 6px;
  font-size: 11px; color: var(--muted); letter-spacing: .5px;
}
.nav-item {
  display: flex; align-items: center; gap: 9px;
  width: 100%; height: 38px; padding: 0 11px;
  border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-2);
  font-size: 13.5px; font-family: inherit; text-align: left; cursor: pointer;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--gray-soft); color: var(--text); }
.nav-item.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 600; }
.nav-item .ni { width: 18px; text-align: center; font-size: 15px; }
.nav-item .ni-count {
  margin-left: auto; font-size: 11px; color: var(--muted);
  background: var(--gray-soft); border-radius: 999px; padding: 1px 7px;
}
.nav-item.active .ni-count { background: #fff; color: var(--primary-dark); }

.side-foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--border); }
.side-foot .sf-title { font-size: 11px; color: var(--muted); }
.side-foot .sf-value { font-size: 12px; color: var(--text-2); margin-top: 4px; }

.content { flex: 1; min-width: 0; padding: 20px; overflow-y: auto; }

/* ---------------- 页面头部 ---------------- */

.page-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h2 { font-size: 19px; }
.page-head .sub { margin-top: 5px; color: var(--text-2); font-size: 13px; }
.page-head .head-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------------- 卡片 ---------------- */

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 16px; }
.card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--border);
}
.card-head h3 { font-size: 14.5px; }
.card-head .head-actions { margin-left: auto; display: flex; gap: 8px; }
.card-body { padding: 16px; }
.card-body.tight { padding: 0; }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.stat {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 15px 16px; box-shadow: var(--shadow);
}
.stat .label { font-size: 12.5px; color: var(--text-2); }
.stat .value { margin-top: 6px; font-size: 24px; font-weight: 600; letter-spacing: -.4px; }
.stat .value small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.stat .hint { margin-top: 4px; font-size: 12px; color: var(--muted); }

/* ---------------- 表单 ---------------- */

.toolbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.toolbar .grow { flex: 1; min-width: 180px; }
.form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

input[type="text"], input[type="password"], input[type="number"], input[type="datetime-local"],
input[type="date"], select, textarea {
  width: 100%; height: 34px; padding: 0 10px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  font-size: 13px; font-family: inherit; color: var(--text); background: #fff;
}
textarea { height: auto; min-height: 84px; padding: 8px 10px; resize: vertical; line-height: 1.6; }
select { cursor: pointer; }
input:focus, select:focus, textarea:focus {
  border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft);
}
.field-inline { display: flex; flex-direction: column; gap: 5px; }
.field-inline > span { font-size: 12.5px; color: var(--text-2); }
.checkbox { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.checkbox input { width: auto; height: auto; }

/* ---------------- 表格 ---------------- */

.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { padding: 10px 12px; text-align: left; vertical-align: middle; }
table.data thead th {
  background: var(--panel-2); color: var(--text-2); font-weight: 500; font-size: 12.5px;
  border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0;
}
table.data tbody tr { border-bottom: 1px solid var(--border); }
table.data tbody tr:last-child { border-bottom: none; }
table.data tbody tr:hover { background: #fafbfc; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data .course-name { font-weight: 600; }
table.data .course-code { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 6px; }
table.data .cell-sub { color: var(--text-2); font-size: 12px; }
table.data .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.empty { padding: 46px 20px; text-align: center; color: var(--muted); }
.empty .empty-icon { font-size: 28px; }
.empty p { margin-top: 8px; font-size: 13px; }

.pager { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
.pager .page-info { font-size: 12.5px; color: var(--text-2); }
.pager .spacer { margin-left: auto; }

/* ---------------- 课程卡片（学生选课中心） ---------------- */

.course-list { display: grid; gap: 12px; padding: 16px; }
.course-card {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; background: #fff;
  display: grid; grid-template-columns: 1fr auto; gap: 14px;
  transition: border-color .15s, box-shadow .15s;
}
.course-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.course-card.is-selected { border-left: 3px solid var(--primary); }
.course-card.is-full { background: #fcfcfd; }

.cc-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cc-title .name { font-size: 15px; font-weight: 600; }
.cc-title .code { font-size: 12px; color: var(--muted); }
.cc-meta { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-2); }
.cc-meta .m { display: inline-flex; align-items: center; gap: 5px; }
.cc-sched { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.cc-sched .s {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 2px 8px; font-size: 12px; color: var(--text-2);
}
.cc-bar { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
.progress { flex: 1; max-width: 240px; height: 6px; border-radius: 999px; background: var(--gray-soft); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 999px; background: var(--primary); }
.progress.high i { background: #f04438; }
.progress.mid i { background: #f79009; }
.progress.low i { background: #12b76a; }
.cc-count { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }

.cc-side { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; gap: 10px; min-width: 132px; }
.cc-side .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.cc-reasons { margin-top: 9px; display: grid; gap: 4px; }
.cc-reason { font-size: 12px; color: var(--amber); display: flex; gap: 6px; align-items: flex-start; }
.cc-reason .ic { flex: none; }

/* ---------------- 课表 ---------------- */

.timetable { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
.timetable th, .timetable td { border: 1px solid var(--border); padding: 0; }
.timetable thead th { background: var(--panel-2); padding: 9px 6px; font-weight: 500; color: var(--text-2); }
.timetable tbody th {
  width: 78px; background: var(--panel-2); padding: 6px; color: var(--text-2);
  font-weight: 400; text-align: center; font-size: 12px; line-height: 1.35;
}
.timetable tbody th .p-time { color: var(--muted); font-size: 11px; }
.timetable tbody th.p-cell .p-no { display: block; }
.timetable tbody th.band {
  width: 40px; background: #eef2f7; color: var(--text); font-weight: 600;
  vertical-align: middle; letter-spacing: 1px;
}
.timetable tbody th.band .band-t { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 3px; }

/* 课时表（选课规则页） */
.pt-wrap { max-width: 520px; }
.period-table td { text-align: center; }
.period-table td.pt-band { background: var(--panel-2); font-weight: 600; vertical-align: middle; letter-spacing: 2px; }
.period-table td.pt-group { background: var(--panel-2); font-weight: 600; vertical-align: middle; }
.period-table td.pt-no { color: var(--text-2); }
.period-table td.pt-time { font-variant-numeric: tabular-nums; }
.timetable td { height: 62px; vertical-align: top; position: relative; }
.timetable td.empty-cell { background: repeating-linear-gradient(45deg, #fbfcfd, #fbfcfd 6px, #f7f9fb 6px, #f7f9fb 12px); }
.timetable td.conflict-cell { background: var(--red-soft); }
.timetable .slot {
  height: 100%; padding: 7px 8px; border-left: 3px solid var(--primary);
  background: linear-gradient(180deg, #f5f8ff, #eef4ff);
  display: flex; flex-direction: column; gap: 3px;
}
.timetable .slot .n { font-weight: 600; font-size: 12.5px; color: #1e3a8a; }
.timetable .slot .t, .timetable .slot .p { color: var(--text-2); font-size: 11.5px; }
.timetable .slot.c1 { border-left-color: #2563eb; background: linear-gradient(180deg,#f5f8ff,#eaf1ff); }
.timetable .slot.c2 { border-left-color: #079455; background: linear-gradient(180deg,#f2fdf7,#e7f9f0); }
.timetable .slot.c3 { border-left-color: #b54708; background: linear-gradient(180deg,#fffaf0,#fef3e2); }
.timetable .slot.c4 { border-left-color: #6941c6; background: linear-gradient(180deg,#f9f8ff,#f1efff); }
.timetable .slot.c5 { border-left-color: #0ea5e9; background: linear-gradient(180deg,#f2fafd,#e6f5fb); }
.timetable .slot.c6 { border-left-color: #db2777; background: linear-gradient(180deg,#fdf4f9,#fbe9f3); }

/* ---------------- 进度条 / 类别学分 ---------------- */

.cat-credit { display: grid; gap: 10px; }
.cat-credit-item .top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
.cat-credit-item .bar { height: 7px; border-radius: 999px; background: var(--gray-soft); overflow: hidden; }
.cat-credit-item .bar i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.cat-credit-item .bar i.ok { background: var(--green); }

/* ---------------- 描述列表 ---------------- */

.desc { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; font-size: 13px; }
.desc dt { color: var(--text-2); }
.desc dd { margin: 0; }

.kv-list { display: grid; gap: 10px; }
.kv-list .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding-bottom: 8px; border-bottom: 1px dashed var(--border); }
.kv-list .kv:last-child { border-bottom: none; padding-bottom: 0; }
.kv-list .kv .k { color: var(--text-2); }
.kv-list .kv .v { font-weight: 600; text-align: right; }

/* ---------------- 时间线 ---------------- */

.timeline { display: grid; gap: 0; }
.tl-item { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
.tl-item .dot-wrap { display: flex; flex-direction: column; align-items: center; }
.tl-item .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); margin-top: 5px; flex: none; }
.tl-item .line { flex: 1; width: 1px; background: var(--border); }
.tl-item:last-child .line { display: none; }
.tl-item .tl-body { padding-bottom: 16px; }
.tl-item .tl-title { font-size: 13.5px; font-weight: 600; }
.tl-item .tl-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tl-item .tl-text { font-size: 12.5px; color: var(--text-2); margin-top: 4px; }

/* ---------------- 通知 ---------------- */

.notice-item { display: flex; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
.notice-item:last-child { border-bottom: none; }
.notice-item.unread { background: #f8fbff; }
.notice-item .n-body { flex: 1; min-width: 0; }
.notice-item .n-title { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.notice-item .n-text { margin-top: 4px; font-size: 12.5px; color: var(--text-2); }
.notice-item .n-time { margin-top: 6px; font-size: 12px; color: var(--muted); }
.notice-item .n-side { display: flex; align-items: center; gap: 8px; }

/* ---------------- 模态框 / 抽屉 ---------------- */

.modal-mask {
  position: fixed; inset: 0; background: rgba(16, 24, 40, .48);
  display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 100;
  animation: fade .16s ease-out;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 100%; max-width: 620px; max-height: 88vh; display: flex; flex-direction: column;
  background: #fff; border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden;
  animation: pop .18s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
.modal.wide { max-width: 860px; }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 15.5px; }
.modal-head .close { margin-left: auto; }
.modal-body { padding: 18px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 13px 18px; border-top: 1px solid var(--border); background: var(--panel-2); }

/* ---------------- Toast ---------------- */

.toast-root {
  position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 200; align-items: center;
  pointer-events: none;
}
.toast {
  min-width: 220px; max-width: 520px;
  padding: 10px 16px; border-radius: var(--radius-sm);
  background: #101828; color: #fff; font-size: 13px;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: flex-start; gap: 9px;
  animation: toastIn .18s ease-out;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.toast.success { background: #054f31; }
.toast.error { background: #7a271a; }
.toast.warn { background: #7a2e0e; }
.toast .t-text { flex: 1; }
.toast .t-detail { margin-top: 4px; font-size: 12px; opacity: .85; }

/* ---------------- 提示条 ---------------- */

.alert {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 14px;
  border: 1px solid transparent;
}
.alert .a-ic { flex: none; font-size: 14px; }
.alert-info { background: var(--primary-soft); border-color: #c7d7fe; color: #1e3a8a; }
.alert-warn { background: var(--amber-soft); border-color: #fedf89; color: #93370d; }
.alert-error { background: var(--red-soft); border-color: #fecdca; color: var(--red); }
.alert-success { background: var(--green-soft); border-color: #abefc6; color: #05603a; }

.loading { padding: 44px; text-align: center; color: var(--muted); font-size: 13px; }
.spinner {
  width: 18px; height: 18px; margin: 0 auto 10px;
  border: 2px solid var(--border-strong); border-top-color: var(--primary);
  border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.muted { color: var(--muted); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.section-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
.sep { height: 1px; background: var(--border); margin: 14px 0; }

/* ---------------- 响应式 ---------------- */

@media (max-width: 1024px) {
  .login-page { grid-template-columns: 1fr; }
  .login-brand { display: none; }
}

@media (max-width: 860px) {
  .menu-toggle { display: inline-flex; }
  .sidebar {
    position: fixed; top: var(--topbar-h); bottom: 0; left: 0; z-index: 40;
    transform: translateX(-100%); transition: transform .2s ease-out;
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: none; }
  .content { padding: 14px; }
  .course-card { grid-template-columns: 1fr; }
  .cc-side { align-items: stretch; }
  .cc-side .badges { flex-direction: row; align-items: center; }
  .cc-side .btn { width: 100%; }
  .logo-text, .term-chip { display: none; }
  .user-meta { display: none; }
  .modal { max-height: 92vh; }
}

@media (max-width: 600px) {
  .toolbar { flex-direction: column; align-items: stretch; }
  .page-head .head-actions { width: 100%; }
  table.data th, table.data td { padding: 8px 9px; }
}

/* 打印视图（课表导出） */
@media print {
  .topbar, .sidebar, .page-head .head-actions, .no-print { display: none !important; }
  .content { padding: 0; overflow: visible; }
  .layout, .body { height: auto; display: block; }
  .card { box-shadow: none; border: none; }
}


/* 单文件演示版补充样式 */

}
.static-bar-text { flex: 1; }

@media print { .static-bar { display: none; } }

/**
 * 静态版（免安装单文件网页）· 基础设施层
 *
 * 设计意图：
 *   数据库版把业务数据放在 MySQL、把逻辑放在 Node/Express；
 *   单文件网页版把两者都搬进浏览器内存，用同一套业务规则复刻后端行为。
 *   因此这里的函数命名与职责，刻意与数据库版的 server/ 目录保持一一对应，
 *   便于两份实现互相对照与回归。
 *
 * 本文件包含：时间工具、内存表存储、自增主键、审计日志、通知、指标采集。
 */

/* ================================================================== */
/* 一、时间工具                                                        */
/* ================================================================== */

function pad2(n) {
  return String(n).padStart(2, '0');
}

/** 统一的时间格式：'YYYY-MM-DD HH:mm:ss'（与后端写库格式一致，便于字符串直接比较） */
function fmtDateTime(d) {
  const x = d instanceof Date ? d : new Date(d);
  return (
    `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())} ` +
    `${pad2(x.getHours())}:${pad2(x.getMinutes())}:${pad2(x.getSeconds())}`
  );
}

function fmtDay(d) {
  const x = d instanceof Date ? d : new Date(d);
  return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
}

/** 当前时刻字符串 */
function now() {
  return fmtDateTime(new Date());
}

/**
 * 解析数据库时间串为 Date。
 * 支持 'YYYY-MM-DD' 与 'YYYY-MM-DD HH:mm:ss' 两种形态；
 * 手工解析而不依赖 Date.parse，避免不同浏览器的时区/格式差异。
 */
function toDate(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) return v;
  const s = String(v).trim().replace('T', ' ');
  const [dPart, tPart] = s.split(' ');
  const d = (dPart || '').split('-').map(Number);
  const t = (tPart || '00:00:00').split(':').map(Number);
  if (!d[0]) return null;
  return new Date(d[0], (d[1] || 1) - 1, d[2] || 1, t[0] || 0, t[1] || 0, t[2] || 0);
}

/** 在指定时间上增加天数，返回新的时间串 */
function addDays(v, days) {
  const d = toDate(v);
  if (!d) return null;
  d.setDate(d.getDate() + days);
  return d;
}

/* 二、内存表存储                                                      */
/* ================================================================== */

/** 全部表数据（结构完全对齐数据库版的 18 张 t_ 表） */
let tables = {};
/** 各表自增主键游标 */
let seq = {};

/** 数据版本号：每次重置自增，用于让前端缓存失效 */
let dataVersion = 1;

function clone(v) {
  return JSON.parse(JSON.stringify(v));
}

/** 用初始种子数据重建全部表，并重算自增游标 */
function resetData() {
  tables = {};
  seq = {};
  Object.keys(DATA).forEach((name) => {
    const rows = clone(DATA[name]);
    tables[name] = rows;
    seq[name] = rows.reduce((m, r) => Math.max(m, Number(r.id) || 0), 0) + 1;
  });
  dataVersion += 1;
}

function tbl(name) {
  if (!tables[name]) tables[name] = [];
  return tables[name];
}

function nextId(name) {
  if (!seq[name]) seq[name] = 1;
  return seq[name]++;
}

/** 插入一行；未显式给 id 时自动分配 */
function insert(name, row) {
  const r = row;
  if (r.id === undefined || r.id === null) r.id = nextId(name);
  r.created_at = r.created_at || now();
  r.updated_at = r.updated_at || now();
  tbl(name).push(r);
  return r;
}

/** 按 id 查找 */
function findById(name, id) {
  return tbl(name).find((r) => Number(r.id) === Number(id)) || null;
}

/** 浅层条件查询：{ field: value } */
function findWhere(name, cond) {
  return tbl(name).filter((r) =>
    Object.keys(cond).every((k) => {
      const want = cond[k];
      if (Array.isArray(want)) return want.map(Number).includes(Number(r[k]));
      return String(r[k]) === String(want);
    })
  );
}

function removeWhere(name, cond) {
  const keep = tbl(name).filter(
    (r) => !Object.keys(cond).every((k) => String(r[k]) === String(cond[k]))
  );
  const removed = tbl(name).length - keep.length;
  tables[name] = keep;
  return removed;
}

/** 按自定义谓词删除，用于「字段 A 或字段 B 命中」这类复合删除条件 */
function removeBy(name, predicate) {
  const keep = tbl(name).filter((r) => !predicate(r));
  const removed = tbl(name).length - keep.length;
  tables[name] = keep;
  return removed;
}

function randomId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function createSession(payload) {
  const jti = payload.jti;
  sessions.set(jti, {
    userId: payload.userId,
    username: payload.username,
    realName: payload.realName,
    role: payload.role,
    lastActive: Date.now(),
  });
  return jti;
}

function isSessionIdle(jti) {
  const s = sessions.get(jti);
  if (!s) return true;
  return Date.now() - s.lastActive > CONFIG.auth.idleTimeoutMinutes * 60 * 1000;
}

function touchSession(jti) {
  const s = sessions.get(jti);
  if (s) s.lastActive = Date.now();
  return s;
}

/* 七、运行指标（对齐后端 store/metrics.js 的口径）                     */
/* ================================================================== */

const metricsState = {
  startAt: Date.now(),
  total: 0,
  success: 0,
  fail: 0,
  durations: [],
  byPath: new Map(),
  errorsByCode: new Map(),
};

function recordMetric(path, code, ms) {
  metricsState.total += 1;
  if (code === 0) metricsState.success += 1;
  else {
    metricsState.fail += 1;
    metricsState.errorsByCode.set(code, (metricsState.errorsByCode.get(code) || 0) + 1);
  }
  metricsState.durations.push(ms);
  if (metricsState.durations.length > 500) metricsState.durations.shift();

  const key = path;
  if (!metricsState.byPath.has(key)) {
    metricsState.byPath.set(key, { total: 0, fail: 0, totalMs: 0 });
  }
  const v = metricsState.byPath.get(key);
  v.total += 1;
  v.totalMs += ms;
  if (code !== 0) v.fail += 1;
}

function percentile(arr, p) {
  if (!arr.length) return 0;
  const sorted = [...arr].sort((a, b) => a - b);
  const idx = Math.min(sorted.length - 1, Math.ceil((p / 100) * sorted.length) - 1);
  return sorted[Math.max(0, idx)];
}

function metricsSnapshot(queueLength) {
  const durations = metricsState.durations;
  const avg = durations.length ? durations.reduce((a, b) => a + b, 0) / durations.length : 0;
  const rate = metricsState.total ? metricsState.success / metricsState.total : 1;

  const topPaths = [...metricsState.byPath.entries()]
    .map(([path, v]) => ({
      path,
      total: v.total,
      fail: v.fail,
      avgMs: v.total ? Math.round(v.totalMs / v.total) : 0,
      errorRate: v.total ? Math.round((v.fail / v.total) * 10000) / 100 : 0,
    }))
    .sort((a, b) => b.total - a.total)
    .slice(0, 12);

  return {
    uptimeSeconds: Math.round((Date.now() - metricsState.startAt) / 1000),
    totalRequests: metricsState.total,
    successRequests: metricsState.success,
    failedRequests: metricsState.fail,
    successRate: Math.round(rate * 10000) / 100,
    writeP95Ms: percentile(durations, 95),
    writeAvgMs: Math.round(avg),
    queueLength: queueLength || 0,
    cacheDiff: 0,
    errorsByCode: [...metricsState.errorsByCode.entries()]
      .map(([code, count]) => ({ code, count }))
      .sort((a, b) => b.count - a.count),
    topPaths,
  };
}

};

const PERIOD_COUNT = 13;

/** 节次区间 → 起止时间文本，如 (1, 2) → '08:00~09:25' */
function periodRangeText(start, end) {
  const a = PERIOD_TIME[start];
  const b = PERIOD_TIME[end] || a;
  if (!a) return '';
  return `${a.slice(0, 5)}~${b.slice(6)}`;
}

/** 校验排课时段（星期、节次区间、单双周）；与 server/utils/period.js 口径一致 */
function assertValidSchedules(list) {

  list.forEach((s) => {
    const wd = Number(s.weekday);
    const sp = Number(s.startPeriod !== undefined ? s.startPeriod : s.start_period);
    const ep = Number(s.endPeriod !== undefined ? s.endPeriod : s.end_period);
    const parity = Number(s.parity || 0);
    if (!(wd >= 1 && wd <= 7)) throw new AppError(CODES.BAD_REQUEST, '星期取值需在 1 至 7 之间');
    if (!(sp >= 1 && ep <= PERIOD_COUNT && sp <= ep)) {
      throw new AppError(CODES.BAD_REQUEST, `节次取值不合法（1 至 ${PERIOD_COUNT}，且起始不大于结束）`);
    }
    if (![0, 1, 2].includes(parity)) throw new AppError(CODES.BAD_REQUEST, '单双周取值不合法');
  });
}

/**

 * 与 server/services/ruleService.js 一一对应（行为保持一致，仅把 SQL 换成内存表操作）。

const WEEKDAY_TEXT = ['', '周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const PARITY_TEXT = { 0: '全周', 1: '单周', 2: '双周' };

function weekdayText(n) {
  return WEEKDAY_TEXT[n] || '';
}

function parityText(n) {
  return PARITY_TEXT[n] || '全周';
}

/** 'YYYY-MM-DD HH:mm'，用于提示文案 */
function fmt(v) {
  const d = toDate(v);
  if (!d) return '';
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(
    d.getMinutes()
  )}`;
}

/** 取当前学期；无 is_current 时取最新学期 */
function getCurrentTerm() {
  const rows = [...tbl('t_term')].sort((a, b) => {
    if (Number(b.is_current) !== Number(a.is_current)) return Number(b.is_current) - Number(a.is_current);
    return String(b.start_date).localeCompare(String(a.start_date));
  });
  return rows.length ? rows[0] : null;
}

function getTermById(termId) {

/* ------------------------------------------------------------------ */
/* 批次准入（4.1 / 4.5 第一层）                                        */
/* ------------------------------------------------------------------ */

/**
 * 一名学生可能命中多个批次，取「优先级最高（priority 最小）且时间窗口命中」的批次。
 * 返回 { batch, matches, next }
 */
function resolveBatch(termId, student, at) {
  const when = at instanceof Date ? at : toDate(at) || new Date();
  const rows = tbl('t_enroll_batch')
    .filter((b) => Number(b.term_id) === Number(termId) && Number(b.status) === 1)
    .sort((a, b) => {
      const p = Number(a.priority) - Number(b.priority);
      if (p !== 0) return p;
      return String(a.start_time).localeCompare(String(b.start_time));
    });

  const matched = rows.filter((b) => {
    const gradeOk =
      !b.target_grade ||
      String(b.target_grade)
        .split(',')
        .map((s) => s.trim())
        .filter(Boolean)
        .includes(student.grade);
    const collegeOk = !b.target_college || String(b.target_college).includes(student.college);
    return gradeOk && collegeOk;
  });

  const inWindow = matched.filter((b) => {
    const s = toDate(b.start_time);
    const e = toDate(b.end_time);
    return when >= s && when <= e;
  });

  return {
    batch: inWindow.length ? inWindow[0] : null,
    matches: matched,
    next: matched.find((b) => toDate(b.start_time) > when) || null,
  };
}

/** 批次校验：不在窗口内抛 2005 */
function assertInBatch(termId, student, at) {
  const { batch, next } = resolveBatch(termId, student, at);
  if (!batch) {
    const hint = next
      ? `你的选课批次将于 ${fmt(next.start_time)} 开放`
      : '当前不在任何可选批次时间内，请查看选课通知';
    throw new AppError(CODES.OUT_OF_BATCH, `当前不在你可选的选课批次时间内。${hint}`, {
      nextBatch: next ? { name: next.name, startTime: next.start_time } : null,
    });
  }
  return batch;
}

/* ------------------------------------------------------------------ */
/* 时间冲突检测（4.3）                                                 */
/* ------------------------------------------------------------------ */

/**
 * 判定条件：weekday 相同，且节次区间相交，且单双周不互斥。
 * 一门课存在多个时段时，任一时段冲突即整体冲突。
 */
function detectConflict(offeringId, studentId, termId, excludeOfferingIds) {
  const exclude = [Number(offeringId), ...(excludeOfferingIds || []).map(Number)].filter(
    (x) => x !== null && x !== undefined && !Number.isNaN(x)
  );

  const mySchedule = tbl('t_course_schedule').filter((s) => !exclude.includes(Number(s.offering_id)));
  const myOfferingIds = new Set(
    tbl('t_enrollment')
      .filter((e) => Number(e.student_id) === Number(studentId) && Number(e.status) === 1)
      .map((e) => Number(e.offering_id))
  );

  const s1List = tbl('t_course_schedule').filter((s) => Number(s.offering_id) === Number(offeringId));
  const conflicts = [];
  const tightTransfers = [];

  s1List.forEach((s1) => {
    mySchedule.forEach((s2) => {
      if (!myOfferingIds.has(Number(s2.offering_id))) return;
      const o2 = findById('t_course_offering', s2.offering_id);
      if (!o2 || Number(o2.term_id) !== Number(termId)) return;
      const course = findById('t_course', o2.course_id);
      if (!course) return;

      if (Number(s2.weekday) !== Number(s1.weekday)) return;
      const parityExclusive =
        (Number(s1.parity) === 1 && Number(s2.parity) === 2) ||
        (Number(s1.parity) === 2 && Number(s2.parity) === 1);
      if (parityExclusive) return;

      const overlap = Number(s1.start_period) <= Number(s2.end_period) && Number(s2.start_period) <= Number(s1.end_period);
      if (overlap) {
        if (!conflicts.some((c) => Number(c.offering_id) === Number(s2.offering_id) && c.weekday === s1.weekday)) {
          conflicts.push({
            course_name: course.name,
            course_code: course.course_code,
            offering_id: Number(s2.offering_id),
            weekday: Number(s1.weekday),
            start_period: Number(s1.start_period),
            end_period: Number(s1.end_period),
            parity: Number(s1.parity),
            other_start_period: Number(s2.start_period),
            other_end_period: Number(s2.end_period),
            other_parity: Number(s2.parity),
            campus: s1.campus,
            other_campus: s2.campus,
          });
        }
        return;
      }

      // 赶课提示：同一天相邻节次但校区不同（不阻止选课）
      const adjacent =
        Number(s2.start_period) === Number(s1.end_period) + 1 || Number(s1.start_period) === Number(s2.end_period) + 1;
      const campusDiff = String(s1.campus || '') !== String(s2.campus || '');
      if (adjacent && campusDiff) {
        if (!tightTransfers.some((t) => Number(t.offering_id) === Number(s2.offering_id))) {
          tightTransfers.push({
            offering_id: Number(s2.offering_id),
            course_name: course.name,
            weekday: Number(s1.weekday),
            start_period: Number(s1.start_period),
            end_period: Number(s1.end_period),
            campus: s1.campus,
            other_campus: s2.campus,
            other_start_period: Number(s2.start_period),
            other_end_period: Number(s2.end_period),
          });
        }
      }
    });
  });

  return { conflicts, tightTransfers };
}

/** 取本学期已选总学分与类别学分 */
function getCreditSummary(studentId, termId) {
  const map = new Map();
  tbl('t_enrollment')
    .filter((e) => Number(e.student_id) === Number(studentId) && Number(e.status) === 1)
    .forEach((e) => {
      const o = findById('t_course_offering', e.offering_id);
      if (!o || Number(o.term_id) !== Number(termId)) return;
      const c = findById('t_course', o.course_id);
      if (!c) return;
      const cat = findById('t_course_category', c.category_id);
      const key = c.category_id;
      if (!map.has(key)) {
        map.set(key, {
          categoryId: Number(c.category_id),
          categoryName: cat ? cat.name : '',
          credit: 0,
          count: 0,
        });
      }
      const item = map.get(key);
      item.credit += Number(c.credit || 0);
      item.count += 1;
    });

  const byCategory = [...map.values()];
  const total = byCategory.reduce((s, r) => s + r.credit, 0);
  return { total, byCategory };
}

function getCreditRule(termId, grade) {
  const rows = tbl('t_credit_rule').filter(
    (r) => Number(r.term_id) === Number(termId) && String(r.grade) === String(grade)
  );
  return rows.length ? rows[0] : null;
}

function getCategoryCreditRules(termId) {
  return tbl('t_category_credit_rule')
    .filter((r) => Number(r.term_id) === Number(termId))
    .map((r) => {
      const c = findById('t_course_category', r.category_id);
      return { ...r, category_name: c ? c.name : '' };
    });
}

/** 学分校验：超过上限抛 2003（下限不用于拦截，仅作预警） */
function assertCreditNotExceed(studentId, termId, grade, addCredit, subtractCredit) {
  const rule = getCreditRule(termId, grade);
  if (!rule) return { maxCredit: null, willTotal: null };
  const summary = getCreditSummary(studentId, termId);
  const willTotal = summary.total - Number(subtractCredit || 0) + Number(addCredit || 0);
  if (willTotal > Number(rule.max_credit)) {
    throw new AppError(
      CODES.CREDIT_EXCEED,
      `选课后本学期总学分为 ${willTotal}，将超出上限 ${Number(rule.max_credit)} 学分`,
      { currentCredit: summary.total, addCredit: Number(addCredit), maxCredit: Number(rule.max_credit) }
    );
  }
  return { maxCredit: Number(rule.max_credit), willTotal, currentCredit: summary.total };
}

/** 支持「与」（全部满足）与「或」（满足其一）两种类型；未满足抛 2004 */
function assertPrereqSatisfied(studentId, courseId) {
  const rows = tbl('t_course_prereq')
    .filter((p) => Number(p.course_id) === Number(courseId))
    .map((p) => {
      const c = findById('t_course', p.prereq_course_id);
      const h = tbl('t_student_course_history').find(
        (x) => Number(x.course_id) === Number(p.prereq_course_id) && Number(x.student_id) === Number(studentId)
      );
      return {
        require_type: Number(p.require_type),
        group_no: Number(p.group_no),
        prereq_id: Number(p.prereq_course_id),
        prereq_name: c ? c.name : '',
        course_code: c ? c.course_code : '',
        passed: h ? Number(h.is_passed) : 0,
      };
    });

  if (!rows.length) return { required: [], missing: [] };

  const missing = [];

  rows
    .filter((r) => r.require_type === 1)
    .forEach((r) => {
      if (!r.passed) missing.push({ name: r.prereq_name, code: r.course_code, groupNo: r.group_no });
    });

  const orGroups = new Map();
  rows
    .filter((r) => r.require_type === 2)
    .forEach((r) => {
      if (!orGroups.has(r.group_no)) orGroups.set(r.group_no, []);
      orGroups.get(r.group_no).push(r);
    });
  orGroups.forEach((group, groupNo) => {
    if (!group.some((g) => g.passed)) {
      group.forEach((g) => missing.push({ name: g.prereq_name, code: g.course_code, groupNo }));
    }
  });

  if (missing.length) {
    const text = missing.map((m) => `《${m.name}》`).join('、');
    throw new AppError(CODES.PREREQ_NOT_MET, `需先修并通过指定先修课程：${text}`, { missing });
  }
  return { required: rows, missing: [] };
}

/** 退课截止时间：补退选批次结束后的第 N 天 23:59 */
function getDropDeadline(termId) {
  const rows = tbl('t_enroll_batch').filter(
    (b) => Number(b.term_id) === Number(termId) && Number(b.type) === 2 && Number(b.status) === 1
  );
  if (!rows.length) return null;
  const baseStr = rows.map((b) => b.end_time).sort().pop();
  const base = toDate(baseStr);
  if (!base) return null;
  const deadline = new Date(base);
  deadline.setDate(deadline.getDate() + CONFIG.business.dropDeadlineDaysAfterBatch);
  deadline.setHours(23, 59, 0, 0);
  return deadline;
}

function assertDropAllowed(termId, at) {
  const when = at instanceof Date ? at : new Date();
  const deadline = getDropDeadline(termId);
  if (deadline && when > deadline) {
    throw new AppError(CODES.DROP_CLOSED, `已超过退课截止时间（${fmt(deadline)}），无法退课`, { deadline });
  }
  return deadline;
}

/** 利用率 = 已选 / 容量，≥90% 高、60%~90% 中、<60% 低 */
function heatOf(enrolled, capacity) {
  if (!capacity) return '低';
  const rate = Number(enrolled) / Number(capacity);
  if (rate >= 0.9) return '高';
  if (rate >= 0.6) return '中';
  return '低';
}

function scheduleText(s) {

  const place = [s.campus, s.building, s.room].filter(Boolean).join(' ');

/** 为一批开课挂载排课时段 */
function attachSchedules(offerings) {

  const rows = tbl('t_course_schedule')
    .filter((s) => ids.includes(Number(s.offering_id)))
    .sort((a, b) => Number(a.weekday) - Number(b.weekday) || Number(a.start_period) - Number(b.start_period));

/** 基础查询：按条件筛选开课（含分页与排序） */
function queryOfferings(opts) {
  const { termId, keyword, categoryId, weekday, available, campus, status, page, size, sort } = opts;
  const pageNo = Number(page) || 1;
  const pageSize = Number(size) || 10;

  let rows = tbl('t_course_offering').filter((o) => Number(o.term_id) === Number(termId));

  const withCourse = rows
    .map((o) => {
      const c = findById('t_course', o.course_id);
      if (!c) return null;
      return { o, c };
    })
    .filter(Boolean);

  let list = withCourse.filter(({ o, c }) => {
    if (keyword) {
      const kw = String(keyword).toLowerCase();
      if (!String(c.name).toLowerCase().includes(kw) && !String(c.course_code).toLowerCase().includes(kw)) return false;
    }
    if (categoryId && Number(c.category_id) !== Number(categoryId)) return false;
    if (campus && String(o.campus) !== String(campus)) return false;
    if (status !== undefined && status !== null && status !== '' && Number(o.status) !== Number(status)) return false;
    if (String(available) === 'true' && !(Number(o.status) === 1 && Number(o.enrolled) < Number(o.capacity))) return false;
    if (weekday) {
      const has = tbl('t_course_schedule').some(
        (s) => Number(s.offering_id) === Number(o.id) && Number(s.weekday) === Number(weekday)
      );
      if (!has) return false;
    }
    return true;
  });

  const sorter =
    sort === 'heat'
      ? (a, b) =>
          Number(b.o.enrolled) / Number(b.o.capacity) - Number(a.o.enrolled) / Number(a.o.capacity) ||
          String(a.c.course_code).localeCompare(String(b.c.course_code))
      : sort === 'enrolled'
      ? (a, b) => Number(b.o.enrolled) - Number(a.o.enrolled) || String(a.c.course_code).localeCompare(String(b.c.course_code))
      : (a, b) => String(a.c.course_code).localeCompare(String(b.c.course_code)) || String(a.c.name).localeCompare(String(b.c.name));

  list = list.sort(sorter);
  const total = list.length;
  const paged = list.slice((pageNo - 1) * pageSize, (pageNo - 1) * pageSize + pageSize);

  const mapped = paged.map(({ o, c }) => {
    const cat = findById('t_course_category', c.category_id);
    const t = findById('t_teacher', o.teacher_id);
    const tu = t ? findById('t_user', t.user_id) : null;
    return {
      offering_id: Number(o.id),
      capacity: Number(o.capacity),
      enrolled: Number(o.enrolled),
      offering_status: Number(o.status),
      offering_campus: o.campus,
      remark: o.remark,
      course_id: Number(c.id),
      course_code: c.course_code,
      course_name: c.name,
      credit: Number(c.credit),
      dept: c.dept,
      description: c.description,
      category_id: Number(c.category_id),
      category_name: cat ? cat.name : '',
      teacher_id: t ? Number(t.id) : null,
      teacher_name: tu ? tu.real_name : '',
      teacher_title: t ? t.title : '',
    };
  });

  return { rows: mapped, total };
}

/** 批量标注选课状态（对应设计文档表 6 的按钮状态） */
function annotateOfferings(offerings, ctx) {
  if (!offerings.length) return offerings;
  const { studentId, termId, batchInfo, creditInfo } = ctx;
  const offeringIds = offerings.map((o) => Number(o.offering_id));

  const selectedMap = new Map();
  tbl('t_enrollment')
    .filter((e) => Number(e.student_id) === Number(studentId) && offeringIds.includes(Number(e.offering_id)))
    .forEach((r) => {
      if (Number(r.status) === 1) selectedMap.set(Number(r.offering_id), r);
    });

  const waitMap = new Map();
  tbl('t_waitlist')
    .filter(
      (w) =>
        Number(w.student_id) === Number(studentId) &&
        offeringIds.includes(Number(w.offering_id)) &&
        Number(w.status) === 1
    )
    .forEach((r) => waitMap.set(Number(r.offering_id), r));

  const waitCountMap = new Map();
  tbl('t_waitlist')
    .filter((w) => offeringIds.includes(Number(w.offering_id)) && Number(w.status) === 1)
    .forEach((w) => {
      const k = Number(w.offering_id);
      waitCountMap.set(k, (waitCountMap.get(k) || 0) + 1);
    });

  const myEnrolledIds = new Set(
    tbl('t_enrollment')
      .filter((e) => Number(e.student_id) === Number(studentId) && Number(e.status) === 1)
      .map((e) => Number(e.offering_id))
  );

  // 冲突映射：本页每门开课 vs 本人已选开课
  const conflictMap = new Map();
  const s1All = tbl('t_course_schedule').filter((s) => offeringIds.includes(Number(s.offering_id)));
  const s2All = tbl('t_course_schedule').filter((s) => myEnrolledIds.has(Number(s.offering_id)));
  s1All.forEach((s1) => {
    s2All.forEach((s2) => {
      if (Number(s1.offering_id) === Number(s2.offering_id)) return;
      if (Number(s2.weekday) !== Number(s1.weekday)) return;
      const parityExclusive =
        (Number(s1.parity) === 1 && Number(s2.parity) === 2) || (Number(s1.parity) === 2 && Number(s2.parity) === 1);
      if (parityExclusive) return;
      if (!(Number(s1.start_period) <= Number(s2.end_period) && Number(s2.start_period) <= Number(s1.end_period))) return;

      const o2 = findById('t_course_offering', s2.offering_id);
      if (!o2 || Number(o2.term_id) !== Number(termId)) return;
      const c2 = findById('t_course', o2.course_id);
      if (!c2) return;
      const k = Number(s1.offering_id);
      if (!conflictMap.has(k)) conflictMap.set(k, []);
      const list = conflictMap.get(k);
      if (list.some((x) => x.courseCode === c2.course_code && x.weekday === Number(s1.weekday))) return;
      list.push({
        courseName: c2.name,
        courseCode: c2.course_code,
        weekday: Number(s1.weekday),
        weekdayText: weekdayText(s1.weekday),
        parityText: parityText(s1.parity),
        otherParityText: parityText(s2.parity),
        periods: `${s1.start_period}-${s1.end_period} 节`,
        otherPeriods: `${s2.start_period}-${s2.end_period} 节`,
        campus: s1.campus,
        otherCampus: s2.campus,
      });
    });
  });

  // 先修满足情况：一次性取本页课程的全部先修要求
  const courseIds = [...new Set(offerings.map((o) => Number(o.course_id)))];
  const prereqMap = new Map();
  tbl('t_course_prereq')
    .filter((p) => courseIds.includes(Number(p.course_id)))
    .forEach((p) => {
      const c = findById('t_course', p.prereq_course_id);
      const h = tbl('t_student_course_history').find(
        (x) => Number(x.course_id) === Number(p.prereq_course_id) && Number(x.student_id) === Number(studentId)
      );
      const k = Number(p.course_id);
      if (!prereqMap.has(k)) prereqMap.set(k, []);
      prereqMap.get(k).push({
        require_type: Number(p.require_type),
        group_no: Number(p.group_no),
        prereq_name: c ? c.name : '',
        course_code: c ? c.course_code : '',
        passed: h ? Number(h.is_passed) : 0,
      });
    });

  function prereqMiss(courseId) {
    const rows = prereqMap.get(Number(courseId)) || [];
    if (!rows.length) return [];
    const miss = [];
    rows
      .filter((r) => r.require_type === 1)
      .forEach((r) => {
        if (!r.passed) miss.push(r.prereq_name);
      });
    const groups = new Map();
    rows
      .filter((r) => r.require_type === 2)
      .forEach((r) => {
        if (!groups.has(r.group_no)) groups.set(r.group_no, []);
        groups.get(r.group_no).push(r);
      });
    groups.forEach((g) => {
      if (!g.some((x) => x.passed)) g.forEach((x) => miss.push(x.prereq_name));
    });
    return [...new Set(miss)];
  }

  const batchOk = !!batchInfo.batch;
  const maxCredit = creditInfo.rule ? Number(creditInfo.rule.max_credit) : null;

  offerings.forEach((o) => {
    const selected = selectedMap.get(Number(o.offering_id));
    const wait = waitMap.get(Number(o.offering_id));
    const conflicts = conflictMap.get(Number(o.offering_id)) || [];
    const missPrereq = prereqMiss(o.course_id);
    const willTotal = creditInfo.total + Number(o.credit);
    const creditExceed = maxCredit !== null && willTotal > maxCredit;
    const full = Number(o.enrolled) >= Number(o.capacity) || Number(o.offering_status) === 2;
    const closed = Number(o.offering_status) === 0;

    const reasons = [];
    if (conflicts.length) {
      reasons.push({
        code: 2002,
        text: `与《${conflicts[0].courseName}》冲突（${conflicts[0].weekdayText} ${conflicts[0].periods}）`,
      });
    }
    if (creditExceed) reasons.push({ code: 2003, text: `选后将达 ${willTotal} 学分，超出上限 ${maxCredit}` });
    if (missPrereq.length) reasons.push({ code: 2004, text: `需先修：${missPrereq.join('、')}` });
    if (!batchOk) reasons.push({ code: 2005, text: '当前不在你的选课批次时间内' });
    if (full) reasons.push({ code: 2001, text: '名额已满，可加入候补' });

    let statusText = 'AVAILABLE';
    if (closed) statusText = 'CLOSED';
    else if (selected) statusText = 'SELECTED';
    else if (wait) statusText = 'WAITLISTED';
    else if (!batchOk) statusText = 'OUT_OF_BATCH';
    else if (full) statusText = 'FULL';
    else if (conflicts.length) statusText = 'CONFLICT';
    else if (creditExceed || missPrereq.length) statusText = 'INELIGIBLE';

    o.status = statusText;
    o.selectable = statusText === 'AVAILABLE';
    o.waitlistable = (statusText === 'FULL' || statusText === 'CLOSED') && !selected && !wait;
    o.willTotalCredit = willTotal;
    o.heat = heatOf(o.enrolled, o.capacity);
    o.reasons = reasons;
    o.conflicts = conflicts;
    o.missingPrereq = missPrereq;
    o.myEnrollment = selected
      ? { status: Number(selected.status), source: Number(selected.source), selectTime: selected.select_time }
      : null;
    o.myWaitlist = wait ? { queueNo: Number(wait.queue_no), status: Number(wait.status) } : null;
    o.waitlistCount = waitCountMap.get(Number(o.offering_id)) || 0;
    o.remaining = Math.max(0, Number(o.capacity) - Number(o.enrolled));
  });

  return offerings;
}

/** 组装学生侧的选课上下文（批次、学分、先修） */
function buildStudentContext(student, termId) {
  const batchInfo = resolveBatch(termId, student);
  const creditInfo = getCreditSummary(student.id, termId);
  const rule = getCreditRule(termId, student.grade);
  const categoryRules = getCategoryCreditRules(termId);
  const dropDeadline = getDropDeadline(termId);
  return {
    studentId: Number(student.id),
    student,
    termId: Number(termId),
    batchInfo,
    creditInfo: { ...creditInfo, rule },
    categoryRules,
    dropDeadline,
  };
}

/** 开课详情：含排课、余量、热度、先修要求、候补队列 */
function getOfferingDetail(offeringId, ctx) {
  const o = findById('t_course_offering', offeringId);
  if (!o || Number(o.term_id) !== Number(ctx.termId)) return null;
  const c = findById('t_course', o.course_id);
  const cat = findById('t_course_category', c.category_id);
  const t = findById('t_teacher', o.teacher_id);
  const tu = t ? findById('t_user', t.user_id) : null;

  const row = {
    offering_id: Number(o.id),
    capacity: Number(o.capacity),
    enrolled: Number(o.enrolled),
    offering_status: Number(o.status),
    offering_campus: o.campus,
    remark: o.remark,
    course_id: Number(c.id),
    course_code: c.course_code,
    course_name: c.name,
    credit: Number(c.credit),
    dept: c.dept,
    description: c.description,
    category_id: Number(c.category_id),
    category_name: cat ? cat.name : '',
    teacher_id: t ? Number(t.id) : null,
    teacher_name: tu ? tu.real_name : '',
    teacher_title: t ? t.title : '',
    teacher_college: t ? t.college : '',
  };

  const rows = [row];
  attachSchedules(rows);
  annotateOfferings(rows, ctx);

  const detailed = rows[0];
  detailed.prereqList = tbl('t_course_prereq')
    .filter((p) => Number(p.course_id) === Number(c.id))
    .map((p) => {
      const pc = findById('t_course', p.prereq_course_id);
      const h = tbl('t_student_course_history').find(
        (x) => Number(x.course_id) === Number(p.prereq_course_id) && Number(x.student_id) === Number(ctx.studentId)
      );
      return {
        name: pc ? pc.name : '',
        code: pc ? pc.course_code : '',
        requireType: Number(p.require_type),
        groupNo: Number(p.group_no),
        passed: !!(h && Number(h.is_passed)),
      };
    });

  detailed.waitlistQueue = tbl('t_waitlist')
    .filter((w) => Number(w.offering_id) === Number(offeringId) && Number(w.status) === 1)
    .sort((a, b) => Number(a.queue_no) - Number(b.queue_no))
    .slice(0, 10)
    .map((w) => {
      const s = getStudentById(w.student_id);
      return { queueNo: Number(w.queue_no), studentNo: s ? s.student_no : '', name: s ? s.real_name : '' };
    });

  return detailed;
}

/* ================================================================== */
/* 选课 / 退课 / 换课（enrollmentService）                             */
/* ================================================================== */

/** 取开课基础信息 */
function getOffering(offeringId) {
  const o = findById('t_course_offering', offeringId);
  if (!o) return null;
  const c = findById('t_course', o.course_id);
  if (!c) return null;
  return {
    ...o,
    course_name: c.name,
    course_code: c.course_code,
    credit: Number(c.credit),
    course_id: Number(c.id),
  };
}

/**
 * 条件更新占用名额（最终防线）。
 * 数据库版依靠 InnoDB 行锁保证余量不为负；内存版为单线程，语义等价：
 * 只有 enrolled < capacity 且未停开时才自增，否则视为已满。
 */
function occupySeat(offeringId) {
  const o = findById('t_course_offering', offeringId);
  if (!o || Number(o.status) === 0 || Number(o.enrolled) >= Number(o.capacity)) {
    throw new AppError(CODES.COURSE_FULL, undefined, { offeringId: Number(offeringId) });
  }
  o.enrolled = Number(o.enrolled) + 1;
  o.updated_at = now();
  if (Number(o.status) === 1 && Number(o.enrolled) >= Number(o.capacity)) o.status = 2;
  return true;
}

function releaseSeat(offeringId) {
  const o = findById('t_course_offering', offeringId);
  if (!o) return;
  if (Number(o.enrolled) > 0) o.enrolled = Number(o.enrolled) - 1;
  if (Number(o.status) === 2 && Number(o.enrolled) < Number(o.capacity)) o.status = 1;
  o.updated_at = now();
}

/** 写入选课记录：唯一键冲突时复用该行 */
function upsertEnrollment(studentId, offeringId, source) {
  const exist = tbl('t_enrollment').find(
    (e) => Number(e.student_id) === Number(studentId) && Number(e.offering_id) === Number(offeringId)
  );
  if (exist) {
    exist.status = 1;
    exist.select_time = now();
    exist.source = Number(source);
    exist.drop_time = null;
    exist.updated_at = now();
    return exist;
  }
  return insert('t_enrollment', {
    student_id: Number(studentId),
    offering_id: Number(offeringId),
    select_time: now(),
    status: 1,
    source: Number(source),
    drop_time: null,
  });
}

function conflictText(conflicts) {
  return conflicts
    .map(
      (c) =>
        `《${c.course_name}》${weekdayText(c.weekday)} ${c.start_period}-${c.end_period} 节（${parityText(c.parity)}）`
    )
    .join('；');
}

/**
 * 选课（6.1）。
 * 校验顺序：鉴权 → 幂等 → 批次 → 重复 → 容量占用 → 冲突 → 学分 → 先修 → 落库。
 * 与数据库版一致：先占名额再校验，任一步失败则回滚（此处手动归还名额）。
 */
function enroll(payload, student, offeringId) {
  const term = getCurrentTerm();
  if (!term) throw new AppError(CODES.INTERNAL_ERROR, '系统未配置当前学期');

  const offering = getOffering(offeringId);
  if (!offering || Number(offering.term_id) !== Number(term.id)) throw new AppError(CODES.OFFERING_NOT_FOUND);
  if (Number(offering.status) === 0) throw new AppError(CODES.OFFERING_CLOSED);

  const batch = assertInBatch(term.id, student);

  const dup = tbl('t_enrollment').find(
    (e) => Number(e.student_id) === Number(student.id) && Number(e.offering_id) === Number(offeringId)
  );
  if (dup && Number(dup.status) === 1) throw new AppError(CODES.ALREADY_ENROLLED);

  const wl = tbl('t_waitlist').find(
    (w) =>
      Number(w.student_id) === Number(student.id) &&
      Number(w.offering_id) === Number(offeringId) &&
      Number(w.status) === 1
  );
  if (wl) {
    throw new AppError(CODES.ALREADY_WAITLISTED, `你已加入候补，当前排位为第 ${wl.queue_no} 位`, {
      queueNo: Number(wl.queue_no),
    });
  }

  let extra;
  occupySeat(offeringId);
  try {
    const { conflicts, tightTransfers } = detectConflict(offeringId, student.id, term.id, []);
    if (conflicts.length) {
      throw new AppError(CODES.TIME_CONFLICT, `与已选课程时间冲突：${conflictText(conflicts)}`, { conflicts });
    }
    const creditInfo = assertCreditNotExceed(student.id, term.id, student.grade, offering.credit, 0);
    assertPrereqSatisfied(student.id, offering.course_id);
    upsertEnrollment(student.id, offeringId, 1);
    extra = {
      credit: creditInfo,
      tightTransfers: tightTransfers.map((t) => ({
        courseName: t.course_name,
        text: `${weekdayText(t.weekday)} ${t.end_period} 节与《${t.course_name}》${t.other_start_period} 节相邻且分处 ${t.campus}/${t.other_campus}`,
      })),
    };
  } catch (err) {
    releaseSeat(offeringId); // 回滚已占名额
    throw err;
  }

  sendNotice(
    payload.user.userId,
    NOTICE_TYPE.ENROLL_RESULT,
    '选课成功',
    `你已成功选修《${offering.course_name}》（${offering.course_code}），${offering.credit} 学分。`,
    offeringId
  );
  logAudit(payload, {
    action: 'ENROLL',
    targetType: 'OFFERING',
    targetId: offeringId,
    result: 1,
    detail: `选课成功：${offering.course_name}；批次=${batch.name}`,
  });

  return {
    offeringId: Number(offeringId),
    courseName: offering.course_name,
    batch: { id: Number(batch.id), name: batch.name },
    credit: extra.credit,
    tightTransfers: extra.tightTransfers || [],
  };
}

/** 退课（6.2） */
function drop(payload, student, offeringId) {
  const term = getCurrentTerm();
  const offering = getOffering(offeringId);
  if (!offering || Number(offering.term_id) !== Number(term.id)) throw new AppError(CODES.OFFERING_NOT_FOUND);

  const deadline = assertDropAllowed(term.id);

  const row = tbl('t_enrollment').find(
    (e) => Number(e.student_id) === Number(student.id) && Number(e.offering_id) === Number(offeringId)
  );
  if (!row || Number(row.status) !== 1) throw new AppError(CODES.NOT_ENROLLED);

  row.status = 0;
  row.drop_time = now();
  row.updated_at = now();
  releaseSeat(offeringId);

  sendNotice(
    payload.user.userId,
    NOTICE_TYPE.DROP_RESULT,
    '退课已生效',
    `你已退选《${offering.course_name}》（${offering.course_code}），名额已释放。`,
    offeringId
  );
  logAudit(payload, {
    action: 'DROP',
    targetType: 'OFFERING',
    targetId: offeringId,
    result: 1,
    detail: `退课成功：${offering.course_name}`,
  });

  const promoted = promoteFromOffering(offeringId);

  return {
    offeringId: Number(offeringId),
    courseName: offering.course_name,
    deadline,
    promoted: promoted.result,
  };
}

/**
 * 换课（6.3 单一事务「先占后放」）。
 * 校验目标开课可选并预占 → 释放原开课名额 → 触发原开课候补递补。
 * 任一步失败整体回滚，原课程与名额不变，返回 2009。
 */
function switchCourse(payload, student, fromOfferingId, toOfferingId) {
  if (Number(fromOfferingId) === Number(toOfferingId)) {
    throw new AppError(CODES.SWITCH_TARGET_INVALID, '原课程与目标课程相同，无需换课');
  }
  const term = getCurrentTerm();
  const from = getOffering(fromOfferingId);
  const to = getOffering(toOfferingId);
  if (!from || !to || Number(from.term_id) !== Number(term.id) || Number(to.term_id) !== Number(term.id)) {
    throw new AppError(CODES.OFFERING_NOT_FOUND);
  }
  if (Number(to.status) === 0) throw new AppError(CODES.SWITCH_TARGET_INVALID, '目标课程已停开');

  const batch = assertInBatch(term.id, student);

  const src = tbl('t_enrollment').find(
    (e) =>
      Number(e.student_id) === Number(student.id) &&
      Number(e.offering_id) === Number(fromOfferingId) &&
      Number(e.status) === 1
  );
  if (!src) throw new AppError(CODES.NOT_ENROLLED, '你尚未选修原课程，无法换课');

  try {
    occupySeat(toOfferingId);
    const { conflicts } = detectConflict(toOfferingId, student.id, term.id, [fromOfferingId]);
    if (conflicts.length) {
      throw new AppError(CODES.TIME_CONFLICT, `目标课程与已选课程冲突：${conflictText(conflicts)}`, { conflicts });
    }
    assertCreditNotExceed(student.id, term.id, student.grade, to.credit, from.credit);
    assertPrereqSatisfied(student.id, to.course_id);

    src.status = 0;
    src.drop_time = now();
    src.updated_at = now();
    releaseSeat(fromOfferingId);
    upsertEnrollment(student.id, toOfferingId, 1);
  } catch (err) {
    if (err instanceof AppError) {
      // 归还已预占的目标名额（原课程此时尚未释放）
      releaseSeat(toOfferingId);
      if (err.code === CODES.NOT_ENROLLED) throw err;
      throw new AppError(CODES.SWITCH_TARGET_INVALID, `换课未生效：${err.message}`, {
        reasonCode: err.code,
        reason: err.message,
        ...(err.extra || {}),
      });
    }
    releaseSeat(toOfferingId);
    throw err;
  }

  sendNotice(
    payload.user.userId,
    NOTICE_TYPE.ENROLL_RESULT,
    '换课成功',
    `已将《${from.course_name}》换为《${to.course_name}》。`,
    toOfferingId
  );
  logAudit(payload, {
    action: 'SWITCH',
    targetType: 'OFFERING',
    targetId: toOfferingId,
    result: 1,
    detail: `换课：${from.course_name} → ${to.course_name}；批次=${batch.name}`,
  });

  const promoted = promoteFromOffering(fromOfferingId);

  return {
    from: { offeringId: Number(fromOfferingId), courseName: from.course_name },
    to: { offeringId: Number(toOfferingId), courseName: to.course_name },
    promoted: promoted.result,
    tightTransfers: [],
  };
}

/** 我的已选课程 */
function myEnrollments(student, termId) {
  const rows = tbl('t_enrollment')
    .filter((e) => Number(e.student_id) === Number(student.id) && Number(e.status) === 1)
    .map((e) => {
      const o = findById('t_course_offering', e.offering_id);
      if (!o || Number(o.term_id) !== Number(termId)) return null;
      const c = findById('t_course', o.course_id);
      const cat = findById('t_course_category', c.category_id);
      const t = findById('t_teacher', o.teacher_id);
      const tu = t ? findById('t_user', t.user_id) : null;
      return {
        enrollment_id: Number(e.id),
        offering_id: Number(e.offering_id),
        select_time: e.select_time,
        source: Number(e.source),
        status: Number(e.status),
        course_code: c.course_code,
        course_name: c.name,
        credit: Number(c.credit),
        description: c.description,
        category_name: cat ? cat.name : '',
        category_id: Number(c.category_id),
        capacity: Number(o.capacity),
        enrolled: Number(o.enrolled),
        campus: o.campus,
        offering_status: Number(o.status),
        teacher_name: tu ? tu.real_name : '',
        teacher_title: t ? t.title : '',
      };
    })
    .filter(Boolean)
    .sort((a, b) => String(a.select_time).localeCompare(String(b.select_time)));

  return rows.map((r) => {
    const list = tbl('t_course_schedule')
      .filter((s) => Number(s.offering_id) === Number(r.offering_id))
      .sort((a, b) => Number(a.weekday) - Number(b.weekday) || Number(a.start_period) - Number(b.start_period));
    return {
      ...r,
      schedules: list,
      scheduleText: list.map((s) => scheduleText(s)),
      placeText: list
        .map((s) => [s.campus, s.building, s.room].filter(Boolean).join(' '))
        .filter(Boolean)
        .join(' / '),
      heat: heatOf(r.enrolled, r.capacity),
    };
  });
}

/** 我的课表（按周视图，支持单双周切换） */
function timetable(student, termId, parity) {
  const list = myEnrollments(student, termId);
  const cells = [];
  list.forEach((item) => {
    item.schedules.forEach((s) => {
      if (parity && Number(parity) !== 0 && Number(s.parity) !== 0 && Number(s.parity) !== Number(parity)) return;
      cells.push({
        offeringId: Number(item.offering_id),
        courseName: item.course_name,
        courseCode: item.course_code,
        teacherName: item.teacher_name,
        credit: item.credit,
        categoryName: item.category_name,
        weekday: Number(s.weekday),
        startPeriod: Number(s.start_period),
        endPeriod: Number(s.end_period),
        parity: Number(s.parity),
        parityText: parityText(s.parity),
        place: [s.campus, s.building, s.room].filter(Boolean).join(' '),
        campus: s.campus,
        source: item.source,
      });
    });
  });

  const conflictCells = [];
  for (let i = 0; i < cells.length; i += 1) {
    for (let j = i + 1; j < cells.length; j += 1) {
      const a = cells[i];
      const b = cells[j];
      if (
        a.weekday === b.weekday &&
        a.startPeriod <= b.endPeriod &&
        b.startPeriod <= a.endPeriod &&
        !((a.parity === 1 && b.parity === 2) || (a.parity === 2 && b.parity === 1))
      ) {
        conflictCells.push([a.offeringId, b.offeringId]);
      }
    }
  }

  const totalCredit = list.reduce((s, x) => s + Number(x.credit), 0);
  return { cells, conflictCells, totalCredit, courseCount: list.length };
}

/* ================================================================== */
/* 候补与自动递补（waitlistService）                                   */
/* ================================================================== */

const WAIT_STATUS = { WAITING: 1, PROMOTED: 2, CANCELED: 3, INVALID: 4 };

/** 加入候补 */
function joinWaitlist(payload, student, offeringId) {
  const term = getCurrentTerm();
  const offering = getOffering(offeringId);
  if (!offering || Number(offering.term_id) !== Number(term.id)) throw new AppError(CODES.OFFERING_NOT_FOUND);

  assertInBatch(term.id, student);

  const selected = tbl('t_enrollment').find(
    (e) =>
      Number(e.student_id) === Number(student.id) &&
      Number(e.offering_id) === Number(offeringId) &&
      Number(e.status) === 1
  );
  if (selected) throw new AppError(CODES.ALREADY_ENROLLED);

  const exist = tbl('t_waitlist').find(
    (w) => Number(w.student_id) === Number(student.id) && Number(w.offering_id) === Number(offeringId)
  );
  if (exist && Number(exist.status) === WAIT_STATUS.WAITING) {
    throw new AppError(CODES.ALREADY_WAITLISTED, `你已加入候补，当前排位为第 ${exist.queue_no} 位`, {
      queueNo: Number(exist.queue_no),
    });
  }
  if (exist && Number(exist.status) === WAIT_STATUS.PROMOTED) {
    throw new AppError(CODES.ALREADY_ENROLLED, '你已通过候补递补获得该课程名额');
  }

  assertPrereqSatisfied(student.id, offering.course_id);

  const maxNo = tbl('t_waitlist')
    .filter((w) => Number(w.offering_id) === Number(offeringId))
    .reduce((m, w) => Math.max(m, Number(w.queue_no) || 0), 0);
  const queueNo = maxNo + 1;

  if (exist) {
    exist.queue_no = queueNo;
    exist.join_time = now();
    exist.status = 1;
    exist.expire_time = null;
    exist.updated_at = now();
  } else {
    insert('t_waitlist', {
      student_id: Number(student.id),
      offering_id: Number(offeringId),
      queue_no: queueNo,
      join_time: now(),
      status: 1,
      expire_time: null,
    });
  }

  sendNotice(
    payload.user.userId,
    NOTICE_TYPE.WAITLIST_PROMOTED,
    '已加入候补',
    `你已加入《${offering.course_name}》候补队列，当前排位第 ${queueNo} 位，名额释放后将按排位自动递补。`,
    offeringId
  );
  logAudit(payload, {
    action: 'WAITLIST_JOIN',
    targetType: 'OFFERING',
    targetId: offeringId,
    result: 1,
    detail: `加入候补：${offering.course_name}，排位 ${queueNo}`,
  });

  return {
    offeringId: Number(offeringId),
    courseName: offering.course_name,
    queueNo,
    queueCount: countWaiting(offeringId),
  };
}

/** 取消候补 */
function cancelWaitlist(payload, student, offeringId) {
  const row = tbl('t_waitlist').find(
    (w) => Number(w.student_id) === Number(student.id) && Number(w.offering_id) === Number(offeringId)
  );
  if (!row || Number(row.status) !== WAIT_STATUS.WAITING) throw new AppError(CODES.NOT_WAITLISTED);
  row.status = 3;
  row.updated_at = now();
  logAudit(payload, {
    action: 'WAITLIST_CANCEL',
    targetType: 'OFFERING',
    targetId: offeringId,
    result: 1,
    detail: '取消候补',
  });
  return { offeringId: Number(offeringId), queueNo: Number(row.queue_no) };
}

/** 我的候补列表 */
function myWaitlist(student, termId) {
  const rows = tbl('t_waitlist')
    .filter((w) => Number(w.student_id) === Number(student.id) && [1, 2].includes(Number(w.status)))
    .map((w) => {
      const o = findById('t_course_offering', w.offering_id);
      if (!o || Number(o.term_id) !== Number(termId)) return null;
      const c = findById('t_course', o.course_id);
      const cat = findById('t_course_category', c.category_id);
      const t = findById('t_teacher', o.teacher_id);
      const tu = t ? findById('t_user', t.user_id) : null;
      return {
        id: Number(w.id),
        offering_id: Number(w.offering_id),
        queue_no: Number(w.queue_no),
        join_time: w.join_time,
        status: Number(w.status),
        expire_time: w.expire_time,
        course_code: c.course_code,
        course_name: c.name,
        credit: Number(c.credit),
        category_name: cat ? cat.name : '',
        capacity: Number(o.capacity),
        enrolled: Number(o.enrolled),
        offering_status: Number(o.status),
        campus: o.campus,
        teacher_name: tu ? tu.real_name : '',
      };
    })
    .filter(Boolean)
    .sort((a, b) => String(a.join_time).localeCompare(String(b.join_time)));

  return rows.map((r) => {
    const waiting = tbl('t_waitlist').filter(
      (w) => Number(w.offering_id) === Number(r.offering_id) && Number(w.status) === 1
    );
    const minNo = waiting.reduce((m, w) => Math.min(m, Number(w.queue_no)), r.queue_no);
    return {
      ...r,
      heat: heatOf(r.enrolled, r.capacity),
      waitingCount: waiting.length,
      aheadCount: Number(r.status) === 1 ? Math.max(0, Number(r.queue_no) - minNo) : 0,
      statusText: Number(r.status) === 1 ? '候补中' : '已递补',
    };
  });
}

function countWaiting(offeringId) {
  return tbl('t_waitlist').filter(
    (w) => Number(w.offering_id) === Number(offeringId) && Number(w.status) === 1
  ).length;
}

/**
 * 名额释放后的自动递补主流程。
 * 取排位最靠前的候补学生 → 重新执行完整选课校验 → 通过则递补，不通过则置为失效并顺延。
 */
function promoteFromOffering(offeringId) {
  const trace = [];
  const MAX_ITER = 20;

  const term = getCurrentTerm();
  const offering = getOffering(offeringId);
  if (!offering || !term) return { result: trace };

  for (let i = 0; i < MAX_ITER; i += 1) {
    const off = findById('t_course_offering', offeringId);
    if (!off || Number(off.status) === 0 || Number(off.enrolled) >= Number(off.capacity)) {
      return { result: trace, stopReason: '名额已被占满或开课已停开' };
    }

    const cands = tbl('t_waitlist')
      .filter((w) => Number(w.offering_id) === Number(offeringId) && Number(w.status) === 1)
      .sort((a, b) => Number(a.queue_no) - Number(b.queue_no));
    if (!cands.length) return { result: trace };
    const cand = cands[0];

    const student = getStudentById(cand.student_id);

    try {
      const batch = assertInBatch(term.id, student, new Date());
      const { conflicts } = detectConflict(offeringId, student.id, term.id, []);
      if (conflicts.length) {
        throw new AppError(CODES.TIME_CONFLICT, `与已选课程时间冲突：${conflictText(conflicts)}`, { conflicts });
      }
      assertCreditNotExceed(student.id, term.id, student.grade, offering.credit, 0);
      assertPrereqSatisfied(student.id, offering.course_id);

      occupySeat(offeringId);
      upsertEnrollment(student.id, offeringId, 2);

      const expire = new Date(Date.now() + CONFIG.business.waitlistConfirmHours * 3600 * 1000);
      cand.status = 2;
      cand.expire_time = fmtDateTime(expire);
      cand.updated_at = now();

      sendNotice(
        student.user_id,
        NOTICE_TYPE.WAITLIST_PROMOTED,
        '候补递补成功',
        `你候补的《${offering.course_name}》已递补成功，请于 ${fmt(expire)} 前确认。`,
        offeringId
      );

      trace.push({
        action: 'PROMOTED',
        studentNo: student.student_no,
        studentName: student.real_name,
        queueNo: Number(cand.queue_no),
        batch: batch.name,
        expireTime: fmtDateTime(expire),
      });
      return { result: trace };
    } catch (err) {
      if (!(err instanceof AppError)) throw err;
      cand.status = 4;
      cand.updated_at = now();
      sendNotice(
        student.user_id,
        NOTICE_TYPE.WAITLIST_FAILED,
        '候补递补失败',
        `你候补的《${offering.course_name}》本次递补未通过校验（${err.message}），名额已顺延下一位。`,
        offeringId
      );
      trace.push({
        action: 'INVALID',
        studentNo: student.student_no,
        studentName: student.real_name,
        queueNo: Number(cand.queue_no),
        reason: err.message,
        reasonCode: err.code,
      });
    }
  }

  return { result: trace, stopReason: '达到单次递补处理上限' };
}

/** 确认递补名额 */
function confirmWaitlist(payload, student, offeringId) {
  const row = tbl('t_waitlist').find(
    (w) => Number(w.student_id) === Number(student.id) && Number(w.offering_id) === Number(offeringId)
  );
  if (!row || Number(row.status) !== WAIT_STATUS.PROMOTED) {
    throw new AppError(CODES.NOT_WAITLISTED, '你没有待确认的递补名额');
  }
  row.expire_time = null;
  row.updated_at = now();
  logAudit(payload, {
    action: 'WAITLIST_CONFIRM',
    targetType: 'OFFERING',
    targetId: offeringId,
    result: 1,
    detail: '确认候补递补名额',
  });
  return { offeringId: Number(offeringId), confirmed: true };
}

'use strict';

/**
 * 静态版 · 接口路由分发
 *
 * 复刻数据库版 Express 的各路由模块（auth / courses / enrollments / waitlist /
 * notices / teacher / admin / sys），保持路径、入参、返回体与错误码完全一致，
 * 因此前端页面代码无需任何改动即可直接运行。
 */

/** 演示环境登录口令（编码存放，避免明文散落在源码中） */
const DEMO_SECRET = (typeof atob === 'function' ? atob('MTIzNDU2') : '123456');

function page(list, total, pageNo, size) {
  return { total, page: pageNo, size, list };
}

function reg(pattern) {
  return pattern.split('/').map((seg) => (seg.startsWith(':') ? { param: seg.slice(1) } : seg));
}

function matchPath(pattern, path) {
  const pp = reg(pattern);
  const ap = path.split('/');
  if (pp.length !== ap.length) return null;
  const params = {};
  for (let i = 0; i < pp.length; i += 1) {
    const seg = pp[i];
    if (typeof seg === 'object') params[seg.param] = decodeURIComponent(ap[i]);
    else if (seg !== ap[i]) return null;
  }
  return params;
}
