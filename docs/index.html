route('GET', '/api/auth/captcha', null, async () => {
  const a = randomInt(2, 19);
  const b = randomInt(1, 9);
  const plus = randomInt(0, 1) === 1;
  const answer = plus ? a + b : a - b;
  const id = randomId();
  captchas.set(id, { answer, expire: Date.now() + 3 * 60 * 1000 });
  return { data: { captchaId: id, question: `${a} ${plus ? '+' : '−'} ${b} = ?` } };
});

route('POST', '/api/auth/login', null, async (ctx) => {
  const { username, password, captchaId, captchaAnswer } = ctx.body || {};
  if (!username || !password) throw new AppError(CODES.BAD_REQUEST, '请输入账号与密码');

  const failures = loginFailures.get(username) || 0;
  if (failures >= CONFIG.auth.captchaAfterFailures) {
    const item = captchaId ? captchas.get(captchaId) : null;
    const valid = item && item.expire > Date.now() && Number(captchaAnswer) === item.answer;
    if (captchaId) captchas.delete(captchaId);
    if (!valid) return { code: CODES.AUTH_FAILED, message: '请输入正确的验证码', data: { needCaptcha: true } };
  }

  const user = getUserByUsername(username);
  if (!user || password !== DEMO_SECRET) {
    const c = failures + 1;
    loginFailures.set(username, c);
    logAudit({ user: null, ip: ctx.ip }, {
      action: 'LOGIN',
      targetType: 'USER',
      result: 0,
      detail: `账号或密码错误：${username}（连续失败 ${c} 次）`,
    });
    return {
      code: CODES.AUTH_FAILED,
      message: MESSAGES[CODES.AUTH_FAILED],
      data: { needCaptcha: c >= CONFIG.auth.captchaAfterFailures },
    };
  }
  if (Number(user.status) !== 1) {
    return { code: CODES.FORBIDDEN, message: '账号已被禁用，请联系系统管理员', data: null };
  }

  loginFailures.delete(username);
  user.last_login_at = now();
  user.updated_at = now();

  const profile = buildProfile(user);
  const jti = randomId();
  createSession({ jti, userId: user.id, username: user.username, realName: user.real_name, role: Number(user.role) });

  logAudit({ user: { userId: user.id, username: user.username }, ip: ctx.ip }, {
    action: 'LOGIN',
    targetType: 'USER',
    targetId: user.id,
    result: 1,
    detail: '登录成功',
  });

  return {
    data: {
      token: jti,
      expiresInMinutes: CONFIG.auth.idleTimeoutMinutes,
      profile,
    },
  };
});

        scheduleText: r.scheduleText,

route('GET', '/api/notices', 'any', async (ctx) => {
  const pageNo = Number(ctx.query.page) || 1;
  const size = Math.min(Number(ctx.query.size) || 20, 100);
  let rows = tbl('t_notice').filter((n) => Number(n.user_id) === Number(ctx.user.userId));
  if (ctx.query.type) rows = rows.filter((n) => Number(n.type) === Number(ctx.query.type));
  if (String(ctx.query.unread) === 'true') rows = rows.filter((n) => Number(n.is_read) === 0);

  const total = rows.length;
  const sorted = [...rows].sort((a, b) => {
    const r = Number(a.is_read) - Number(b.is_read);
    if (r !== 0) return r;
    return String(b.created_at).localeCompare(String(a.created_at));
  });
  const list = sorted.slice((pageNo - 1) * size, (pageNo - 1) * size + size);
  const unread = tbl('t_notice').filter(
    (n) => Number(n.user_id) === Number(ctx.user.userId) && Number(n.is_read) === 0
  );

  return {
    data: {
      ...page(
        list.map((r) => ({ ...r, typeText: NOTICE_TYPE_TEXT[r.type] || '通知' })),
        total,
        pageNo,
        size
      ),
      unread: unread.length,
    },
  };
});

    .filter((w) => Number(w.status) === 1 && rows.some((r) => r.offering_id === Number(w.offering_id)))

        campus: r.campus,
        remark: r.remark,

route('GET', '/api/admin/dashboard', academicOnly, async () => {

  const offeringIds = new Set(tbl('t_course_offering').filter((o) => Number(o.term_id) === Number(term.id)).map((o) => Number(o.id)));
  const enrollCount = tbl('t_enrollment').filter((e) => Number(e.status) === 1 && offeringIds.has(Number(e.offering_id))).length;

    .map((o) => {

        course_name: c ? c.name : '',

        enrolled: Number(o.enrolled),

      totalCapacity,
      totalEnrolled,
      utilization: totalCapacity ? Math.round((totalEnrolled / totalCapacity) * 1000) / 10 : 0,

      waitCount,

  offering.remark = remark === undefined ? offering.remark : remark;
  offering.updated_at = now();

  if (Number(offering.status) === 1 && Number(offering.enrolled) >= Number(offering.capacity)) offering.status = 2;
  else if (Number(offering.status) === 2 && Number(offering.enrolled) < Number(offering.capacity)) offering.status = 1;

  if (Array.isArray(schedules)) {
    removeWhere('t_course_schedule', { offering_id: id });
    schedules.forEach((s) => {
      insert('t_course_schedule', {
        offering_id: id,
        weekday: Number(s.weekday),
        start_period: Number(s.startPeriod),
        end_period: Number(s.endPeriod),
        parity: Number(s.parity || 0),
        campus: s.campus || null,
        building: s.building || null,
        room: s.room || null,
      });
    });
  }

  const isCapacityChange = capacity !== undefined && Number(capacity) !== Number(offering.capacity);
  logAudit(ctx, {
    action: isCapacityChange ? 'CAPACITY_ADJUST' : 'OFFERING_UPDATE',
    targetType: 'OFFERING',
    targetId: id,
    result: 1,
    detail: isCapacityChange ? `容量调整至 ${offering.capacity}（已选 ${offering.enrolled}）` : '更新开课信息',
  });

  let promoteResult = null;
  if (capacity !== undefined && Number(capacity) > Number(offering.enrolled)) {
    const r = promoteFromOffering(id);
    promoteResult = r.result;
  }
  return { data: { id, promoted: promoteResult }, message: '开课已更新' };
});

/* ================================================================== */
/* 请求分发                                                            */
/* ================================================================== */

function checkRateLimit(userId) {
  const bucket = rateBuckets.get(userId) || [];
  const cutoff = Date.now() - CONFIG.rateLimit.windowSeconds * 1000;
  const hits = bucket.filter((t) => t > cutoff);
  hits.push(Date.now());
  rateBuckets.set(userId, hits);
  if (hits.length > CONFIG.rateLimit.hardLimit) {
    return { needCaptcha: true, count: hits.length };
  }
  if (hits.length > CONFIG.rateLimit.softLimit) {
    return { limited: true, count: hits.length, retryAfter: CONFIG.rateLimit.windowSeconds };
  }
  return { count: hits.length };
}

/**
 * 主入口：处理一次「请求」，返回后端同构的响应体 { code, message, data }。
 * 前端 api.js 只关心这个结构，因此页面代码与数据库版完全共用。
 */
async function handle(method, path, query, body, token) {
  const started = Date.now();
  const cleanPath = String(path).split('?')[0];

  let result;
  try {
    result = await dispatch(method, cleanPath, query || {}, body, token);
  } catch (err) {
    if (err instanceof AppError) {
      result = { code: err.code, message: err.message, data: err.extra === undefined ? null : err.extra };
    } else {
      result = { code: CODES.INTERNAL_ERROR, message: MESSAGES[CODES.INTERNAL_ERROR], data: { detail: String(err && err.message ? err.message : err) } };
    }
  }

  recordMetric(method + ' ' + cleanPath, result.code, Date.now() - started);
  return result;
}

async function dispatch(method, path, query, body, token) {
  let matched = null;
  let params = null;

  for (let i = 0; i < ROUTES.length; i += 1) {
    const r = ROUTES[i];
    if (r.method !== method) continue;
    const p = matchPath(r.path, path);
    if (p) {
      matched = r;
      params = p;
      break;
    }
  }

  if (!matched) {
    return { code: CODES.BAD_REQUEST, message: `接口不存在：${method} ${path}`, data: null };
  }

  // 鉴权
  let user = null;
  if (matched.roles !== null) {
    const session = token ? sessions.get(token) : null;
    if (!session) return { code: CODES.UNAUTHORIZED, message: MESSAGES[CODES.UNAUTHORIZED], data: null };
    if (isSessionIdle(token)) {
      sessions.delete(token);
      return { code: CODES.UNAUTHORIZED, message: MESSAGES[CODES.UNAUTHORIZED], data: null };
    }
    touchSession(token);
    if (matched.roles !== 'any' && !matched.roles.includes(Number(session.role))) {
      logAudit({ user: { userId: session.userId, username: session.username }, ip: '127.0.0.1' }, {
        action: 'FORBIDDEN_ACCESS',
        targetType: 'API',
        result: 0,
        detail: `角色 ${session.role} 访问受限接口 ${method} ${path}`,
      });
      return { code: CODES.FORBIDDEN, message: MESSAGES[CODES.FORBIDDEN], data: null };
    }
    user = {
      userId: session.userId,
      username: session.username,
      realName: session.realName,
      role: Number(session.role),
      jti: token,
    };
  }

  const ctx = { params, query, body: body || {}, user, ip: '127.0.0.1' };

  if (user && matched.roles && matched.roles.includes(ROLE.STUDENT) && matched.roles.length === 1) {
    ctx.student = requireStudent(user);
  }

  // 幂等去重
  const requestId = (body && body.requestId) || query.requestId || null;
  if (matched.opts.idempotent && requestId && user) {
    const key = `${user.userId}:${requestId}`;
    const cached = idempotencyCache.get(key);
    if (cached && Date.now() - cached.at < CONFIG.idempotencyTtlMinutes * 60 * 1000) {
      return cached.body;
    }
  }

  // 限速
  if (matched.opts.rateLimited && user) {
    const state = checkRateLimit(user.userId);
    if (state.needCaptcha) {
      return {
        code: CODES.RATE_LIMITED,
        message: '操作过于频繁，请完成安全验证后重试',
        data: { needCaptcha: true, count: state.count },
      };
    }
    if (state.limited) {
      return {
        code: CODES.RATE_LIMITED,
        message: `操作过于频繁，请 ${state.retryAfter} 秒后再试`,
        data: { retryAfter: state.retryAfter, count: state.count },
      };
    }
  }

  const out = await matched.handler(ctx);
  if (!out) return { code: CODES.OK, message: '操作成功', data: null };

  // handler 允许直接返回完整响应体（用于需要自定义错误码的场景，如登录验证码）
  const response =
    out.code !== undefined && out.message !== undefined && out.data !== undefined && typeof out.code === 'number'
      ? out
      : { code: CODES.OK, message: out.message || '操作成功', data: out.data === undefined ? null : out.data };

  if (matched.opts.idempotent && requestId && user && response.code === 0) {
    idempotencyCache.set(`${user.userId}:${requestId}`, { body: response, at: Date.now() });
  }
  return response;
}

/** HTML 转义，防止 XSS（接口数据插入模板前统一处理） */
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function fmtTime(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return String(v);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function fmtDate(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return String(v);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function relativeTime(v) {
  if (!v) return '';
  const d = new Date(v).getTime();
  const diff = Date.now() - d;
  if (diff < 60 * 1000) return '刚刚';
  if (diff < 3600 * 1000) return `${Math.floor(diff / 60000)} 分钟前`;
  if (diff < 86400 * 1000) return `${Math.floor(diff / 3600000)} 小时前`;
  if (diff < 7 * 86400 * 1000) return `${Math.floor(diff / 86400000)} 天前`;
  return fmtTime(v);
}

/* ---------------- Modal ---------------- */

function openModal({ title, body, footer, wide = false, onMount }) {
  const root = document.getElementById('modal-root');
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `
    <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title || '')}">
      <div class="modal-head">
        <h3>${esc(title || '')}</h3>
        <button class="icon-btn close" aria-label="关闭" data-close>✕</button>
      </div>
      <div class="modal-body"></div>
      ${footer === null ? '' : '<div class="modal-foot"></div>'}
    </div>`;
  const bodyEl = mask.querySelector('.modal-body');
  if (typeof body === 'string') bodyEl.innerHTML = body;
  else if (body instanceof Node) bodyEl.appendChild(body);

  const footEl = mask.querySelector('.modal-foot');
  if (footEl && footer) {
    if (typeof footer === 'string') footEl.innerHTML = footer;
    else if (footer instanceof Node) footEl.appendChild(footer);
  }

  function close() {
    document.removeEventListener('keydown', onKey);
    mask.remove();
  }
  function onKey(e) {
    if (e.key === 'Escape') close();
  }
  mask.querySelector('[data-close]').onclick = () => close();
  mask.addEventListener('click', (e) => {
    if (e.target === mask) close();
  });
  document.addEventListener('keydown', onKey);
  root.appendChild(mask);
  if (onMount) onMount({ mask, body: bodyEl, footer: footEl, close });
  const focusable = mask.querySelector('input, select, textarea, button:not([data-close])');
  if (focusable) setTimeout(() => focusable.focus(), 30);
  return { close, mask, body: bodyEl, footer: footEl };
}

function confirmDialog({ title = '请确认', text = '', confirmText = '确定', danger = false, detail = '' }) {
  return new Promise((resolve) => {
    let settled = false;
    openModal({
      title,
      body: `<p style="font-size:13.5px;color:#475467;line-height:1.7">${esc(text)}</p>${
        detail ? `<div class="alert alert-warn mt-16"><span class="a-ic">!</span><span>${esc(detail)}</span></div>` : ''
      }`,
      footer: `<button class="btn" data-cancel>取消</button>
               <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(confirmText)}</button>`,
      onMount: ({ footer, close, mask }) => {
        footer.querySelector('[data-cancel]').onclick = () => {
          settled = true;
          close();
          resolve(false);
        };
        footer.querySelector('[data-ok]').onclick = () => {
          settled = true;
          close();
          resolve(true);
        };
        mask.addEventListener('click', (e) => {
          if (e.target === mask && !settled) resolve(false);
        });
      },
    });
  });
}

  9002: '系统繁忙，请稍后重试',
  9003: '请求参数有误，请检查后重试',
};

class ApiError extends Error {
  constructor(code, message, data) {
    super(message || ERR_TEXT[code] || '操作失败');
    this.code = code;
    this.data = data || null;
  }
}

// 令牌内存兜底：file:// 等受限环境下浏览器可能禁用 localStorage
let memoryToken = '';

function getToken() {
  try {
    return localStorage.getItem(TOKEN_KEY) || memoryToken || '';
  } catch (e) {
    return memoryToken;
  }
}
function setToken(token) {
  memoryToken = token || '';
  try {
    if (token) localStorage.setItem(TOKEN_KEY, token);
    else localStorage.removeItem(TOKEN_KEY);
  } catch (e) {
    /* 降级为内存令牌，不影响本次会话 */
  }
}

function newRequestId() {
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'req-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

async function request(method, path, { body, query } = {}) {
  const res = await ENGINE.handle(method, path, query || {}, body, getToken());
  if (!res || typeof res.code !== 'number') throw new ApiError(9002, '本地引擎返回格式异常');
  if (res.code !== 0) {
    if (res.code === 1002) {
      setToken('');
      window.dispatchEvent(new CustomEvent('cs:unauthorized'));
    }
    throw new ApiError(res.code, res.message, res.data);
  }
  return res.data;
}

const api = {
  get: (path, query) => request('GET', path, { query }),
  post: (path, body) => request('POST', path, { body }),
  put: (path, body) => request('PUT', path, { body }),
  del: (path, body) => request('DELETE', path, { body }),
};

/** 写操作统一附加 requestId，满足幂等要求 */
function writeBody(payload) {
  return { ...(payload || {}), requestId: newRequestId() };
}

  let detail = '';

      .map((c) => `${WEEKDAY_TEXT[c.weekday]} ${c.start_period}-${c.end_period} 节 与《${c.course_name}》`)

  } else if (extra.queueNo) {

  } else if (extra.nextBatch) {

    detail = `截止时间：${fmtTime(extra.deadline)}`;
  }

}

          <span>课程类别</span>
          <select id="f-category">
            <option value="">全部类别</option>
            ${f.categories.map((c) => `<option value="${c.value}">${esc(c.label)}</option>`).join('')}
          </select>
        </div>
        <div class="field-inline">
          <span>上课星期</span>
          <select id="f-weekday">
            <option value="">不限</option>
            ${f.weekdays.map((w) => `<option value="${w.value}">${esc(w.label)}</option>`).join('')}
          </select>
        </div>
        <div class="field-inline">
          <span>上课校区</span>
          <select id="f-campus">
            <option value="">不限</option>
            ${f.campuses.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="field-inline">
          <span>排序</span>
          <select id="f-sort">
            <option value="code">按课程代码</option>
            <option value="heat">按热度</option>
            <option value="enrolled">按已选人数</option>
          </select>
        </div>
        <label class="checkbox" style="height:34px">
          <input type="checkbox" id="f-available" ${courseFilters.available ? 'checked' : ''} /> 仅看可选
        </label>
        <button class="btn" id="f-reset">重置</button>
      </div>
      <div id="course-list-wrap"></div>
    </div>
  `;

  $('#f-category').value = courseFilters.categoryId;
  $('#f-weekday').value = courseFilters.weekday;
  $('#f-campus').value = courseFilters.campus;
  $('#f-sort').value = courseFilters.sort;

  const reload = () => renderCourses(root, ctx);

  const syncAndLoad = (patch) => {
    Object.assign(courseFilters, patch, { page: patch.page || 1 });
    loadList();
  };

  $('#f-keyword').oninput = debounce((e) => syncAndLoad({ keyword: e.target.value.trim() }), 350);
  $('#f-category').onchange = (e) => syncAndLoad({ categoryId: e.target.value });
  $('#f-weekday').onchange = (e) => syncAndLoad({ weekday: e.target.value });
  $('#f-campus').onchange = (e) => syncAndLoad({ campus: e.target.value });
  $('#f-sort').onchange = (e) => syncAndLoad({ sort: e.target.value });
  $('#f-available').onchange = (e) => syncAndLoad({ available: e.target.checked });
  $('#f-reset').onclick = () => {
    Object.assign(courseFilters, { keyword: '', categoryId: '', weekday: '', campus: '', available: false, sort: 'code', page: 1 });
    reload();
  };
  $('#btn-rules').onclick = () => ctx.go('rules');
  $('#btn-my').onclick = () => ctx.go('my');

  await loadList();

  async function loadList() {
    const wrap = $('#course-list-wrap');
    wrap.innerHTML = loadingState('正在加载课程…');

    let data;
    try {
      data = await api.get('/api/courses', {
        page: courseFilters.page,
        size: courseFilters.size,
        keyword: courseFilters.keyword,
        categoryId: courseFilters.categoryId,
        weekday: courseFilters.weekday,
        campus: courseFilters.campus,
        available: courseFilters.available ? 'true' : '',
        sort: courseFilters.sort,
      });
    } catch (e) {
      wrap.innerHTML = `<div class="alert alert-error" style="margin:16px"><span class="a-ic">✕</span><span>课程加载失败：${esc(e.message)}</span></div>`;
      return;
    }

    const mine = await api.get('/api/enrollments/mine').catch(() => null);
    if (mine) {
      renderBatchAlert(mine);
      ctx.setSub(
        `本学期已选 ${mine.list.length} 门，共 ${mine.totalCredit} 学分${
          mine.creditRule ? `（上限 ${mine.creditRule.max_credit} 学分）` : ''
        }`
      );
    }

    if (!data.list.length) {
      wrap.innerHTML = emptyState('没有符合条件的开课，试试调整筛选条件', '🔍');
      return;
    }

    wrap.innerHTML = `
      <div class="course-list">
        ${data.list.map(courseCard).join('')}
      </div>
      <div class="pager">
        <span class="page-info">共 ${data.total} 条，第 ${data.page} / ${Math.max(1, Math.ceil(data.total / data.size))} 页</span>
        <span class="spacer"></span>
        <button class="btn btn-sm" data-page="prev" ${data.page <= 1 ? 'disabled' : ''}>上一页</button>
        <button class="btn btn-sm" data-page="next" ${
          data.page * data.size >= data.total ? 'disabled' : ''
        }>下一页</button>
      </div>`;

    $$('[data-page]', wrap).forEach((b) => {
      b.onclick = () => {
        courseFilters.page += b.dataset.page === 'next' ? 1 : -1;
        loadList();
      };
    });

    $$('[data-action]', wrap).forEach((btn) => {
      btn.onclick = async () => {
        const id = Number(btn.dataset.id);
        const name = btn.dataset.name;
        let changed = false;
        if (btn.dataset.action === 'enroll') changed = await doEnroll(ctx, id, name);
        else if (btn.dataset.action === 'waitlist') changed = await doWaitlist(ctx, id, name);
        else if (btn.dataset.action === 'drop') changed = await doDrop(ctx, id, name, mine && mine.dropDeadline);
        else if (btn.dataset.action === 'detail') return openCourseDetail(id, ctx);
        if (changed) await loadList();
      };
    });
  }

  function renderBatchAlert(mine) {
    const box = $('#batch-alert');
    if (!mine) {
      box.innerHTML = '';
      return;
    }
    if (mine.batch) {
      box.innerHTML = `<div class="alert alert-info"><span class="a-ic">i</span><span>
        当前生效批次：<strong>${esc(mine.batch.name)}</strong>，开放时间 ${fmtTime(mine.batch.start_time)} 至 ${fmtTime(
        mine.batch.end_time
      )}${mine.dropDeadline ? `；退课截止 ${fmtTime(mine.dropDeadline)}` : ''}</span></div>`;
    } else if (mine.nextBatch) {
      box.innerHTML = `<div class="alert alert-warn"><span class="a-ic">!</span><span>
        你当前不在任何选课批次时间窗口内。下一个批次「${esc(mine.nextBatch.name)}」将于 ${fmtTime(
        mine.nextBatch.start_time
      )} 开放。</span></div>`;
    } else {
      box.innerHTML = `<div class="alert alert-warn"><span class="a-ic">!</span><span>教务尚未为你的年级配置选课批次，请联系教务管理员。</span></div>`;
    }
  }
}

function courseCard(c) {
  const selected = c.status === 'SELECTED';
  const reasonHtml =
    c.reasons && c.reasons.length
      ? `<div class="cc-reasons">${c.reasons
          .map((r) => `<div class="cc-reason"><span class="ic">•</span><span>${esc(r.text)}</span></div>`)
          .join('')}</div>`
      : '';

  const actions = [];
  if (selected) {
    actions.push(`<button class="btn btn-danger btn-sm" data-action="drop" data-id="${c.offeringId}" data-name="${esc(c.courseName)}">退课</button>`);
  } else if (c.status === 'WAITLISTED') {
    actions.push(`<span class="small muted">候补中 第 ${c.myWaitlist ? c.myWaitlist.queueNo : '—'} 位</span>`);
  } else if (c.selectable) {
    actions.push(`<button class="btn btn-primary" data-action="enroll" data-id="${c.offeringId}" data-name="${esc(c.courseName)}">选课</button>`);
  } else if (c.waitlistable) {
    actions.push(`<button class="btn" data-action="waitlist" data-id="${c.offeringId}" data-name="${esc(c.courseName)}">加入候补</button>`);
  } else {
    actions.push(`<button class="btn" disabled>不可选</button>`);
  }
  actions.push(`<button class="btn btn-ghost btn-sm" data-action="detail" data-id="${c.offeringId}">详情</button>`);

  return `
    <article class="course-card ${selected ? 'is-selected' : ''} ${c.status === 'FULL' ? 'is-full' : ''}">
      <div>
        <div class="cc-title">
          <span class="name">${esc(c.courseName)}</span>
          <span class="code">${esc(c.courseCode)}</span>
          <span class="tag">${esc(c.categoryName)}</span>
          <span class="tag">${c.credit} 学分</span>
        </div>
        <div class="cc-meta">
          <span class="m">教师：${esc(c.teacherName)}${c.teacherTitle ? '（' + esc(c.teacherTitle) + '）' : ''}</span>
          <span class="m">校区：${esc(c.campus || '—')}</span>
          ${c.remark ? `<span class="m">备注：${esc(c.remark)}</span>` : ''}
        </div>
        <div class="cc-sched">
          ${(c.scheduleText || []).map((s) => `<span class="s">${esc(s)}</span>`).join('') || '<span class="s">排课待定</span>'}
        </div>
        <div class="cc-bar">
          ${heatProgress(c.enrolled, c.capacity)}
          <span class="cc-count">${c.enrolled} / ${c.capacity}（余 ${c.remaining}）</span>
          ${c.waitlistCount ? `<span class="small muted">候补 ${c.waitlistCount} 人</span>` : ''}
          ${c.willTotalCredit !== undefined ? `<span class="small muted">选后共 ${c.willTotalCredit} 学分</span>` : ''}
        </div>
        ${reasonHtml}
      </div>
      <div class="cc-side">
        <div class="badges">${statusBadge(c.status)}${heatBadge(c.heat)}</div>
        <div class="row-actions">${actions.join('')}</div>
      </div>
    </article>`;
}

function buildTimetable(d, compact = false) {
  if (!d.cells.length) return emptyState('本学期还没有已选课程，去选课中心看看吧', '🗓');

  const conflictSet = new Set();
  (d.conflictCells || []).forEach(([a, b]) => {
    conflictSet.add(a);
    conflictSet.add(b);
  });

  // 默认展示完整的一天（13 节，与学校课时表一致）；
  // 勾选「只看有课节次」后压缩到最后一节有课的节次，便于打印。
  const usedMax = d.cells.reduce((m, c) => Math.max(m, c.endPeriod), 0);
  const last = compact && usedMax ? Math.min(usedMax, PERIOD_COUNT) : PERIOD_COUNT;
  const periods = [];
  for (let p = 1; p <= last; p += 1) periods.push(p);

  const colorOf = (id) => 'c' + ((Number(id) % 6) + 1);

  // 时段（上午 / 下午 / 晚上），与课时表一致
  const bandOf = (p) => PERIOD_BAND[p] || '';
  const bandRows = (p) => periods.filter((x) => x >= p && bandOf(x) === bandOf(p)).length;
  const isBandHead = (p) => p === periods[0] || bandOf(p) !== bandOf(p - 1);

  const rows = periods
    .map((p) => {
      const tds = [1, 2, 3, 4, 5, 6, 7]
        .map((wd) => {
          const hit = d.cells.filter((c) => c.weekday === wd && c.startPeriod <= p && c.endPeriod >= p);
          if (!hit.length) return `<td class="empty-cell"></td>`;
          const c = hit[0];
          if (c.startPeriod !== p) return `<td style="display:none"></td>`;
          const span = c.endPeriod - c.startPeriod + 1;
          const isConflict = conflictSet.has(c.offeringId);
          return `<td rowspan="${span}" class="${isConflict ? 'conflict-cell' : ''}">
            <div class="slot ${colorOf(c.offeringId)}">
              <span class="n">${esc(c.courseName)}</span>
              <span class="t">${esc(c.teacherName)}</span>
              <span class="p">${esc(c.place || '地点待定')}</span>
              ${c.parityText !== '全周' ? `<span class="p">${esc(c.parityText)}</span>` : ''}
              ${isConflict ? '<span class="p" style="color:#b42318">存在冲突</span>' : ''}
            </div>
          </td>`;
        })
        .join('');
      const bandCell = isBandHead(p)
        ? `<th class="band" rowspan="${bandRows(p)}"><span class="band-t">${bandOf(p)}</span></th>`
        : '';
      return `<tr>${bandCell}<th class="p-cell"><span class="p-no">第 ${p} 节</span><span class="p-time">${
        PERIOD_TIME[p] || ''
      }</span></th>${tds}</tr>`;
    })
    .join('');

  return `
    <div class="table-wrap">
      <table class="timetable">
        <thead><tr><th>时段</th><th>节次</th>${[1, 2, 3, 4, 5, 6, 7]
          .map((n) => `<th>${WEEKDAY_TEXT[n]}</th>`)
          .join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${
      conflictSet.size
        ? '<div class="alert alert-error mt-16"><span class="a-ic">✕</span><span>检测到课表内存在时间冲突时段，请与教务联系处理。</span></div>'
        : ''
    }`;
}

async function openSwitchDialog(ctx, fromOfferingId, fromName) {
  const m = openModal({
    title: `换课：${fromName}`,
    wide: true,
    body: loadingState('正在加载可换课程…'),
    footer: null,
  });

  try {
    const data = await api.get('/api/courses', { available: 'true', size: 50, page: 1 });
    const options = data.list.filter((c) => c.offeringId !== fromOfferingId);

    m.body.innerHTML = `
      <div class="alert alert-info"><span class="a-ic">i</span><span>
        换课采用「先占后放」：先校验并预占目标课程名额，成功后再释放原课程名额；
        若目标课程不可选，换课整体不生效，原课程与名额保持不变。</span></div>
      <div class="section-title">选择目标课程（仅列出当前可选的开课）</div>
      ${
        options.length
          ? `<div class="table-wrap"><table class="data">
              <thead><tr><th>课程</th><th>上课时间</th><th class="num">学分</th><th class="num">余量</th><th></th></tr></thead>
              <tbody>${options
                .map(
                  (c) => `<tr>
                  <td><div class="course-name">${esc(c.courseName)}<span class="course-code">${esc(c.courseCode)}</span></div>
                      <div class="cell-sub">${esc(c.teacherName)} · ${esc(c.categoryName)}</div></td>
                  <td>${(c.scheduleText || []).map((s) => esc(s)).join('<br>') || '—'}</td>
                  <td class="num">${c.credit}</td>
                  <td class="num">${c.remaining}</td>
                  <td><button class="btn btn-sm btn-primary" data-pick="${c.offeringId}" data-name="${esc(c.courseName)}">换到这门</button></td>
                </tr>`
                )
                .join('')}</tbody></table></div>`
          : emptyState('当前没有其他可选课程', '🔍')
      }
    `;

    $$('[data-pick]', m.body).forEach((b) => {
      b.onclick = async () => {
        const to = Number(b.dataset.pick);
        m.close();
        const ok = await confirmDialog({
          title: '确认换课',
          text: `将《${fromName}》换为《${b.dataset.name}》？`,
          detail: '换课为单一事务：目标课程预占成功后才会释放原课程名额；任一步失败则整体不生效。',
          confirmText: '确认换课',
        });
        if (!ok) return;
        try {
          const r = await api.post('/api/enrollments/switch', writeBody({ fromOfferingId, toOfferingId: to }));
          const extra =
            r.promoted && r.promoted.length
              ? `原课程名额已递补给候补第 ${r.promoted[0].queueNo} 位同学`
              : '原课程名额已释放';
          toast('换课成功', 'success', extra);
          await ctx.reload();
        } catch (e) {
          handleActionError(e, b.dataset.name);
        }
      };
    });
  } catch (e) {
    m.body.innerHTML = `<div class="alert alert-error"><span class="a-ic">✕</span><span>${esc(e.message)}</span></div>`;
  }
}

/** 课时表（与学校《课时表》一致）：上午 1~5 节、下午 6~10 节、晚上 11~13 节 */
function periodTableHtml() {
  const periods = Array.from({ length: PERIOD_COUNT }, (_, i) => i + 1);
  const bandOf = (p) => PERIOD_BAND[p] || '';
  const groupOf = (p) => PERIOD_GROUP[p] || '';
  const run = (p, key) => periods.filter((x) => x >= p && key(x) === key(p)).length;

  const rows = periods
    .map((p) => {
      const bandCell =
        p === 1 || bandOf(p) !== bandOf(p - 1)
          ? `<td rowspan="${run(p, bandOf)}" class="pt-band">${bandOf(p)}</td>`
          : '';
      const groupCell =
        p === 1 || groupOf(p) !== groupOf(p - 1)
          ? `<td rowspan="${run(p, groupOf)}" class="pt-group">${groupOf(p)}</td>`
          : '';
      return `<tr>${bandCell}${groupCell}<td class="pt-no">${p}</td><td class="pt-time">${
        PERIOD_TIME[p] || ''
      }</td></tr>`;
    })
    .join('');

  return `
    <div class="table-wrap pt-wrap">
      <table class="data period-table">
        <thead><tr><th style="width:76px">时间</th><th style="width:64px">大节</th><th style="width:64px">小节</th><th>起止时间</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="muted small" style="margin-top:10px">每节 40 分钟，同一大节内的小节连排，大节之间设 20 分钟课间。课表、选课与冲突检测均以本节次时间表为准。</p>
  `;
}

function openScheduleEditor(ctx, offeringId, list) {
  const item = list.find((x) => x.offeringId === offeringId);
  const editor = scheduleEditor(item.schedules || []);

  const m = openModal({
    title: `维护排课：${item.courseName}`,
    wide: true,
    body: `
      <div class="alert alert-info"><span class="a-ic">i</span><span>
        教师可维护上课时间与地点；容量由教务管理员设定，此处不可修改。
        保存后系统将按新的时段参与学生选课的时间冲突检测。</span></div>
      <div class="field-inline mb-12">
        <span>备注</span>
        <input type="text" id="of-remark" value="${esc(item.remark || '')}" placeholder="如：需要上机实验" />
      </div>
      ${editor.html}
    `,
    footer: `<button class="btn" data-close-x>取消</button><button class="btn btn-primary" id="btn-save-schedule">保存</button>`,
    onMount: ({ body }) => editor.mount(body),
  });

  m.footer.querySelector('[data-close-x]').onclick = () => m.close();
  m.footer.querySelector('#btn-save-schedule').onclick = async () => {
    const schedules = editor.read(m.body);
    const bad = schedules.find((s) => s.startPeriod > s.endPeriod);
    if (bad) {
      toast('节次区间不合法', 'error', '起始节次不能大于结束节次');
      return;
    }
    const btn = m.footer.querySelector('#btn-save-schedule');
    btn.disabled = true;
    try {
      await api.put(`/api/teacher/offerings/${offeringId}`, {
        schedules,
        remark: m.body.querySelector('#of-remark').value.trim(),
      });
      toast('排课已保存', 'success', `共 ${schedules.length} 个时段`);
      m.close();
      await ctx.reload();
    } catch (e) {
      toast('保存失败', 'error', e.message);
    } finally {
      btn.disabled = false;
    }
  };
}

function openCourseForm(ctx, course, after) {
  const cats = ctx.state.filters.categories;
  const isEdit = !!course;
  const m = openModal({
    title: isEdit ? `编辑课程：${course.name}` : '新增课程',
    body: `
      <div class="form-row">
        <label class="field-inline"><span>课程代码 *</span>
          <input type="text" id="fc-code" value="${esc(course ? course.course_code : '')}" placeholder="如 CS2001" ${isEdit ? 'disabled' : ''} />
        </label>
        <label class="field-inline"><span>课程名称 *</span>
          <input type="text" id="fc-name" value="${esc(course ? course.name : '')}" placeholder="如 数据结构" />
        </label>
      </div>
      <div class="form-row mt-12">
        <label class="field-inline"><span>课程类别 *</span>
          <select id="fc-category">
            ${cats.map((c) => `<option value="${c.value}" ${course && Number(course.category_id) === c.value ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}
          </select>
        </label>
        <label class="field-inline"><span>学分 *</span>
          <input type="number" id="fc-credit" step="0.5" min="0.5" max="10" value="${course ? course.credit : 3}" />
        </label>
        <label class="field-inline"><span>开课单位</span>
          <input type="text" id="fc-dept" value="${esc(course ? course.dept || '' : '')}" placeholder="如 计算机学院" />
        </label>
        ${isEdit ? `<label class="field-inline"><span>状态</span>
          <select id="fc-status">
            <option value="1" ${course.status === 1 ? 'selected' : ''}>启用</option>
            <option value="0" ${course.status === 0 ? 'selected' : ''}>停用</option>
          </select></label>` : ''}
      </div>
      <label class="field-inline mt-12"><span>课程简介</span>
        <textarea id="fc-desc" placeholder="简要说明课程内容">${esc(course ? course.description || '' : '')}</textarea>
      </label>
    `,
    footer: `<button class="btn" data-close-x>取消</button><button class="btn btn-primary" id="fc-save">保存</button>`,
  });

  m.footer.querySelector('[data-close-x]').onclick = () => m.close();
  m.footer.querySelector('#fc-save').onclick = async () => {
    const body = {
      courseCode: m.body.querySelector('#fc-code').value.trim(),
      name: m.body.querySelector('#fc-name').value.trim(),
      categoryId: Number(m.body.querySelector('#fc-category').value),
      credit: Number(m.body.querySelector('#fc-credit').value),
      dept: m.body.querySelector('#fc-dept').value.trim(),
      description: m.body.querySelector('#fc-desc').value.trim(),
    };
    if (isEdit) {
      body.status = Number(m.body.querySelector('#fc-status').value);
      delete body.courseCode;
    }
    if (!body.name || !body.credit) {
      toast('请填写必填项', 'error');
      return;
    }
    try {
      if (isEdit) await api.put(`/api/admin/courses/${course.id}`, body);
      else await api.post('/api/admin/courses', body);
      toast(isEdit ? '课程已更新' : '课程已创建', 'success');
      m.close();
      await after();
    } catch (e) {
      toast('保存失败', 'error', e.message);
    }
  };
}

async function openPrereqForm(ctx, courseId, courseName, after) {
  const m = openModal({ title: `先修关系：${courseName}`, wide: true, body: loadingState(), footer: '' });

  try {
    const [cur, all] = await Promise.all([
      api.get(`/api/admin/courses/${courseId}/prereq`),
      api.get('/api/admin/courses', { size: 100 }),

    const rowsHtml = (list) =>
      list
        .map(
          (p) => `<tr>
          <td>
            <select data-k="prereqCourseId">
              ${options
                .map(
                  (c) =>
                    `<option value="${c.id}" ${
                      Number(p.prereqCourseId || p.prereq_course_id) === c.id ? 'selected' : ''
                    }>${esc(c.course_code)} ${esc(c.name)}</option>`
                )
                .join('')}
            </select>
          </td>
          <td>
            <select data-k="requireType">
              <option value="1" ${Number(p.requireType || p.require_type) === 1 ? 'selected' : ''}>与（需全部满足）</option>
              <option value="2" ${Number(p.requireType || p.require_type) === 2 ? 'selected' : ''}>或（满足其一）</option>
            </select>
          </td>
          <td><input type="number" data-k="groupNo" min="1" value="${Number(p.groupNo || p.group_no || 1)}" /></td>
          <td><button type="button" class="btn btn-sm btn-ghost" data-remove>删除</button></td>
        </tr>`
        )
        .join('');

    m.body.innerHTML = `
      <div class="alert alert-info"><span class="a-ic">i</span><span>
        先修支持「与」（该条必须通过）与「或」（同一分组号内满足其一即可）两种关系；
        学生选课时将依据成绩表中标记为「已通过」的记录判定。</span></div>
      <div class="table-wrap"><table class="data">
        <thead><tr><th>先修课程</th><th>关系类型</th><th>分组号</th><th></th></tr></thead>
        <tbody data-rows>${rowsHtml(cur.list)}</tbody>
      </table></div>
      <button type="button" class="btn btn-sm mt-8" data-add>+ 添加先修课程</button>
    `;

    const tbody = m.body.querySelector('[data-rows]');
    const newRow = () =>
      `<tr>
        <td><select data-k="prereqCourseId">${options
          .map((c) => `<option value="${c.id}">${esc(c.course_code)} ${esc(c.name)}</option>`)
          .join('')}</select></td>
        <td><select data-k="requireType"><option value="1">与（需全部满足）</option><option value="2">或（满足其一）</option></select></td>
        <td><input type="number" data-k="groupNo" min="1" value="1" /></td>
        <td><button type="button" class="btn btn-sm btn-ghost" data-remove>删除</button></td>
      </tr>`;

    function bindRemove() {
      m.body.querySelectorAll('[data-remove]').forEach((b) => {
        b.onclick = () => b.closest('tr').remove();
      });
    }
    bindRemove();
    m.body.querySelector('[data-add]').onclick = () => {
      tbody.insertAdjacentHTML('beforeend', newRow());
      bindRemove();
    };

    const foot = document.createElement('div');
    foot.style.cssText = 'display:flex;gap:10px';
    foot.innerHTML = `<button class="btn" data-close-x>取消</button><button class="btn btn-primary" id="pq-save">保存</button>`;
    m.mask.querySelector('.modal-foot').innerHTML = '';
    m.mask.querySelector('.modal-foot').appendChild(foot);

    foot.querySelector('[data-close-x]').onclick = () => m.close();
    foot.querySelector('#pq-save').onclick = async () => {
      const prereq = Array.from(tbody.querySelectorAll('tr')).map((tr) => ({
        prereqCourseId: Number(tr.querySelector('[data-k="prereqCourseId"]').value),
        requireType: Number(tr.querySelector('[data-k="requireType"]').value),
        groupNo: Number(tr.querySelector('[data-k="groupNo"]').value) || 1,
      }));
      try {
        await api.post(`/api/admin/courses/${courseId}/prereq`, { prereq });
        toast('先修关系已保存', 'success');
        m.close();
        await after();
      } catch (e) {
        toast('保存失败', 'error', e.message);
      }
    };
  } catch (e) {
    m.body.innerHTML = `<div class="alert alert-error"><span class="a-ic">✕</span><span>${esc(e.message)}</span></div>`;
  }
}

function openOfferingForm(d, offering, after) {
  const isEdit = !!offering;
  const editor = scheduleEditor(offering ? offering.schedules : []);

  const m = openModal({
    title: isEdit ? `编辑开课：${offering.course_name}` : '新增开课',
    wide: true,
    body: `
      ${
        isEdit
          ? ''
          : `<div class="form-row mb-12">
        <label class="field-inline"><span>课程 *</span>
          <select id="fo-course">${d.courses
            .map((c) => `<option value="${c.id}">${esc(c.course_code)} ${esc(c.name)}（${c.credit} 学分）</option>`)
            .join('')}</select>
        </label>
        <label class="field-inline"><span>授课教师 *</span>
          <select id="fo-teacher">${d.teachers
            .map((t) => `<option value="${t.id}">${esc(t.real_name)}（${esc(t.teacher_no)}）</option>`)
            .join('')}</select>
        </label>
      </div>`
      }
      <div class="form-row">
        <label class="field-inline"><span>容量上限 *</span>
          <input type="number" id="fo-capacity" min="1" max="500" value="${isEdit ? offering.capacity : 50}" />
        </label>
        <label class="field-inline"><span>校区</span>
          <input type="text" id="fo-campus" value="${esc(isEdit ? offering.campus || '' : '')}" placeholder="如 东校区" />
        </label>
        ${
          isEdit
            ? `<label class="field-inline"><span>状态</span>
          <select id="fo-status">
            <option value="1" ${offering.status === 1 ? 'selected' : ''}>开放</option>
            <option value="0" ${offering.status === 0 ? 'selected' : ''}>停开</option>
          </select></label>`
            : ''
        }
      </div>
      <label class="field-inline mt-12"><span>备注</span>
        <input type="text" id="fo-remark" value="${esc(isEdit ? offering.remark || '' : '')}" />
      </label>
      <div class="sep"></div>
      <div class="section-title">排课时段</div>
      ${editor.html}
      ${isEdit ? `<p class="small muted mt-8">已选 ${offering.enrolled} 人，容量不得小于该数值。</p>` : ''}
    `,
    footer: `<button class="btn" data-close-x>取消</button><button class="btn btn-primary" id="fo-save">保存</button>`,
    onMount: ({ body }) => editor.mount(body),
  });

  m.footer.querySelector('[data-close-x]').onclick = () => m.close();
  m.footer.querySelector('#fo-save').onclick = async () => {
    const schedules = editor.read(m.body);
    const bad = schedules.find((s) => s.startPeriod > s.endPeriod);
    if (bad) {
      toast('节次区间不合法', 'error', '起始节次不能大于结束节次');
      return;
    }
    const body = {
      capacity: Number(m.body.querySelector('#fo-capacity').value),
      campus: m.body.querySelector('#fo-campus').value.trim(),
      remark: m.body.querySelector('#fo-remark').value.trim(),
      schedules,
    };
    if (!body.capacity) {
      toast('请填写容量', 'error');
      return;
    }
    try {
      if (isEdit) {
        body.status = Number(m.body.querySelector('#fo-status').value);
        await api.put(`/api/admin/offerings/${offering.offering_id}`, body);
      } else {
        body.courseId = Number(m.body.querySelector('#fo-course').value);
        body.teacherId = Number(m.body.querySelector('#fo-teacher').value);
        await api.post('/api/admin/offerings', body);
      }
      toast(isEdit ? '开课已更新' : '开课已创建', 'success');
      m.close();
      await after();
    } catch (e) {
      toast('保存失败', 'error', e.message);
    }
  };
}

async function renderQuota(root, ctx) {
  const paint = async () => {
    const box = $('#quota-box');
    box.innerHTML = loadingState();

    box.innerHTML = `
      <div class="table-wrap"><table class="data">
        <thead><tr><th>课程</th><th>教师</th><th class="num">已选</th><th class="num">容量</th><th class="num">余量</th><th class="num">利用率</th><th class="num">候补</th><th>状态</th><th>调整容量</th></tr></thead>
        <tbody>${d.list
          .map(
            (o) => `<tr>
            <td><div class="course-name">${esc(o.course_name)}<span class="course-code">${esc(o.course_code)}</span></div></td>
            <td>${esc(o.teacher_name)}</td>
            <td class="num">${o.enrolled}</td>
            <td class="num">${o.capacity}</td>
            <td class="num">${Math.max(0, o.capacity - o.enrolled)}</td>
            <td class="num">${o.rate}%</td>
            <td class="num">${o.waitlist_count}</td>
            <td>${o.status === 0 ? '<span class="badge badge-red">停开</span>' : o.status === 2 ? '<span class="badge badge-gray">已满</span>' : '<span class="badge badge-green">开放</span>'}</td>
            <td>
              <div style="display:flex;gap:6px;align-items:center">
                <input type="number" min="${o.enrolled}" value="${o.capacity}" data-cap="${o.offering_id}" style="width:82px" />
                <button class="btn btn-sm" data-save="${o.offering_id}" data-name="${esc(o.course_name)}">保存</button>
              </div>
            </td>
          </tr>`
          )
          .join('')}</tbody>
      </table></div>
      <div class="pager"><span class="page-info">共 ${d.list.length} 条开课；容量调整将写入审计日志，扩大容量后系统会自动触发候补递补</span></div>
    `;

    $$('[data-save]', box).forEach((b) => {
      b.onclick = async () => {
        const id = Number(b.dataset.save);
        const input = box.querySelector(`[data-cap="${id}"]`);
        const capacity = Number(input.value);
        const cur = d.list.find((x) => x.offering_id === id);
        if (capacity === cur.capacity) {
          toast('容量未变化', 'info');
          return;
        }
        const ok = await confirmDialog({
          title: '调整容量',
          text: `将《${b.dataset.name}》的容量由 ${cur.capacity} 调整为 ${capacity}？`,
          detail: `当前已选 ${cur.enrolled} 人，候补 ${cur.waitlist_count} 人。${capacity > cur.enrolled ? '容量扩大后系统将自动触发候补递补。' : ''}`,
          confirmText: '确认调整',
        });
        if (!ok) return;
        try {
          const r = await api.put(`/api/admin/offerings/${id}`, { capacity });
          const promoted = r.promoted && r.promoted.length ? `，已递补 ${r.promoted.length} 人` : '';
          toast('容量已调整', 'success', `已写入审计日志${promoted}`);
          await paint();
        } catch (e) {
          toast('调整失败', 'error', e.message);
        }
      };
    });
  };

  root.innerHTML = `
    <div class="page-head">
      <div><h2>名额管理</h2><p class="sub">查看各开课的已选与候补人数，特殊情况下可人工调整容量（写入审计日志）</p></div>
    </div>
    <div class="card"><div class="card-body tight" id="quota-box"></div></div>
  `;
  await paint();
}

function openBatchForm(batch, after) {
  const toLocal = (v) => (v ? String(v).replace(' ', 'T').slice(0, 16) : '');
  const now = new Date();
  const plus = (h) => new Date(now.getTime() + h * 3600 * 1000).toISOString().slice(0, 16);

  const m = openModal({
    title: batch ? `编辑批次：${batch.name}` : '新增选课批次',
    body: `
      <div class="form-row">
        <label class="field-inline"><span>批次名称 *</span>
          <input type="text" id="fb-name" value="${esc(batch ? batch.name : '')}" placeholder="如 2024 级正常选课批次" />
        </label>
        <label class="field-inline"><span>批次类型 *</span>
          <select id="fb-type">
            <option value="1" ${batch && batch.type === 1 ? 'selected' : ''}>正常选课</option>
            <option value="2" ${batch && batch.type === 2 ? 'selected' : ''}>补退选</option>
          </select>
        </label>
      </div>
      <div class="form-row mt-12">
        <label class="field-inline"><span>开始时间 *</span>
          <input type="datetime-local" id="fb-start" value="${batch ? toLocal(batch.start_time) : plus(0)}" />
        </label>
        <label class="field-inline"><span>截止时间 *</span>
          <input type="datetime-local" id="fb-end" value="${batch ? toLocal(batch.end_time) : plus(24 * 14)}" />
        </label>
      </div>
      <div class="form-row mt-12">
        <label class="field-inline"><span>目标年级（逗号分隔，留空不限）</span>
          <input type="text" id="fb-grade" value="${esc(batch ? batch.target_grade || '' : '')}" placeholder="如 2024,2025" />
        </label>
        <label class="field-inline"><span>目标学院（留空不限）</span>
          <input type="text" id="fb-college" value="${esc(batch ? batch.target_college || '' : '')}" placeholder="如 计算机学院" />
        </label>
        <label class="field-inline"><span>优先级（数值越小越优先）</span>
          <input type="number" id="fb-priority" value="${batch ? batch.priority : 1}" />
        </label>
      </div>
      <div class="alert alert-info mt-16"><span class="a-ic">i</span><span>
        提示：一名学生在同一学期可能命中多个批次，系统取其优先级最高且处于时间窗口内的批次作为有效批次。</span></div>
    `,
    footer: `<button class="btn" data-close-x>取消</button><button class="btn btn-primary" id="fb-save">保存</button>`,
  });

  m.footer.querySelector('[data-close-x]').onclick = () => m.close();
  m.footer.querySelector('#fb-save').onclick = async () => {
    const body = {
      name: m.body.querySelector('#fb-name').value.trim(),
      type: Number(m.body.querySelector('#fb-type').value),
      startTime: m.body.querySelector('#fb-start').value,
      endTime: m.body.querySelector('#fb-end').value,
      targetGrade: m.body.querySelector('#fb-grade').value.trim(),
      targetCollege: m.body.querySelector('#fb-college').value.trim(),
      priority: Number(m.body.querySelector('#fb-priority').value) || 0,
    };
    if (!body.name || !body.startTime || !body.endTime) {
      toast('请填写批次名称与起止时间', 'error');
      return;
    }
    if (new Date(body.startTime) >= new Date(body.endTime)) {
      toast('时间不合法', 'error', '开始时间必须早于截止时间');
      return;
    }
    try {
      if (batch) await api.put(`/api/admin/batches/${batch.id}`, body);
      else await api.post('/api/admin/batches', body);
      toast(batch ? '批次已更新' : '批次已创建', 'success');
      m.close();
      await after();
    } catch (e) {
      toast('保存失败', 'error', e.message);
    }
  };
}

    body: isEdit
      ? `
        <div class="form-row">
          <label class="field-inline"><span>账号</span><input type="text" value="${esc(user.username)}" disabled /></label>

        </div>
        <div class="form-row mt-12">
          <label class="field-inline"><span>角色</span>
            <select id="fu-role">
              <option value="1" ${user.role === 1 ? 'selected' : ''}>学生</option>
              <option value="2" ${user.role === 2 ? 'selected' : ''}>教师</option>
              <option value="3" ${user.role === 3 ? 'selected' : ''}>教务管理员</option>
              <option value="4" ${user.role === 4 ? 'selected' : ''}>系统管理员</option>
            </select></label>

            <select id="fu-status">
              <option value="1" ${user.status === 1 ? 'selected' : ''}>正常</option>

            </select></label>
        </div>
        <label class="field-inline mt-12"><span>重置密码（留空则不修改）</span>
          <input type="password" id="fu-pwd" placeholder="输入新密码" /></label>
      `
      : `
        <div class="form-row">
          <label class="field-inline"><span>账号 *</span><input type="text" id="fu-username" placeholder="学号 / 工号 / 管理员账号" /></label>
          <label class="field-inline"><span>姓名 *</span><input type="text" id="fu-name" placeholder="真实姓名" /></label>
        </div>
        <div class="form-row mt-12">
          <label class="field-inline"><span>角色 *</span>
            <select id="fu-role">
              <option value="1">学生</option><option value="2">教师</option>
              <option value="3">教务管理员</option><option value="4">系统管理员</option>
            </select></label>
          <label class="field-inline"><span>初始密码 *</span><input type="password" id="fu-pwd" placeholder="登录密码" /></label>
        </div>
        <div id="fu-extra" class="mt-12"></div>
      `,
    footer: `<button class="btn" data-close-x>取消</button><button class="btn btn-primary" id="fu-save">保存</button>`,
  });

  function renderExtra() {
    if (isEdit) return;
    const role = m.body.querySelector('#fu-role').value;
    const box = m.body.querySelector('#fu-extra');
    if (!box) return;
    if (role === '1') {
      box.innerHTML = `<div class="form-row">
        <label class="field-inline"><span>学号</span><input type="text" id="fu-sno" placeholder="如 2024009" /></label>
        <label class="field-inline"><span>年级</span><input type="text" id="fu-grade" placeholder="如 2024" /></label>
        <label class="field-inline"><span>学院</span><input type="text" id="fu-college" placeholder="如 计算机学院" /></label>
        <label class="field-inline"><span>专业</span><input type="text" id="fu-major" placeholder="如 软件工程" /></label>
      </div>`;
    } else if (role === '2') {
      box.innerHTML = `<div class="form-row">
        <label class="field-inline"><span>工号</span><input type="text" id="fu-tno" placeholder="如 T1005" /></label>
        <label class="field-inline"><span>学院</span><input type="text" id="fu-college" placeholder="如 计算机学院" /></label>
        <label class="field-inline"><span>职称</span><input type="text" id="fu-title" placeholder="如 讲师" /></label>
      </div>`;
    } else {
      box.innerHTML = '';
    }
  }

  if (!isEdit) {
    m.body.querySelector('#fu-role').onchange = renderExtra;
    renderExtra();
  }

  m.footer.querySelector('[data-close-x]').onclick = () => m.close();
  m.footer.querySelector('#fu-save').onclick = async () => {
    const body = {
      realName: (m.body.querySelector('#fu-name') || {}).value || '',
      role: Number(m.body.querySelector('#fu-role').value),
    };
    if (isEdit) {
      body.status = Number(m.body.querySelector('#fu-status').value);
      const p = m.body.querySelector('#fu-pwd').value;
      if (p) body.newPassword = p;
    } else {
      body.username = m.body.querySelector('#fu-username').value.trim();
      body.password = m.body.querySelector('#fu-pwd').value;
      const g = (id) => {
        const el = m.body.querySelector(id);
        return el ? el.value.trim() : '';
      };
      if (body.role === 1) {
        body.studentNo = g('#fu-sno');
        body.grade = g('#fu-grade');
        body.college = g('#fu-college');
        body.major = g('#fu-major');
      } else if (body.role === 2) {
        body.teacherNo = g('#fu-tno');
        body.college = g('#fu-college');
        body.title = g('#fu-title');
      }
      if (!body.username || !body.password || !body.realName) {
        toast('请填写账号、姓名与密码', 'error');
        return;
      }
    }
    try {
      if (isEdit) await api.put(`/api/admin/users/${user.id}`, body);
      else await api.post('/api/admin/users', body);
      toast(isEdit ? '用户已更新' : '用户已创建', 'success');
      m.close();
      await after();
    } catch (e) {
      toast('保存失败', 'error', e.message);
    }
  };
}

            ${
              d.errorsByCode.length
                ? `<div class="table-wrap"><table class="data">
                    <thead><tr><th>错误码</th><th class="num">次数</th></tr></thead>
                    <tbody>${d.errorsByCode.map((e) => `<tr><td>${e.code}</td><td class="num">${e.count}</td></tr>`).join('')}</tbody>
                  </table></div>`
                : emptyState('暂无错误记录', '✓')
            }
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>接口调用统计</h3><div class="head-actions"><span class="small muted">按调用次数排序，取前 12 条</span></div></div>
        <div class="card-body tight">
          <div class="table-wrap"><table class="data">
            <thead><tr><th>接口</th><th class="num">调用次数</th><th class="num">失败次数</th><th class="num">错误率</th><th class="num">平均耗时</th></tr></thead>
            <tbody>${d.topPaths
              .map(
                (p) => `<tr>
                <td><span class="tag">${esc(p.path)}</span></td>
                <td class="num">${p.total}</td>
                <td class="num">${p.fail}</td>
                <td class="num">${p.errorRate}%</td>
                <td class="num">${p.avgMs} ms</td>
              </tr>`
              )
              .join('')}</tbody>
          </table></div>
        </div>
      </div>
    `;
  };

  root.innerHTML = `
    <div class="page-head">
      <div><h2>运行监控</h2><p class="sub">接口成功率与响应时间、在线人数、队列长度、缓存差值，支持阈值告警</p></div>
      <div class="head-actions"><button class="btn" id="btn-refresh-monitor">刷新</button></div>
    </div>
    <div id="monitor-box"></div>
  `;
  $('#btn-refresh-monitor').onclick = paint;
  await paint();
}

return { renderUsers, renderLogs, renderMonitor };
})();

const ctx = {
  state,
  go(path) {
    window.location.hash = '#/' + path.replace(/^\/+/, '');
  },
  async refreshUnread() {
    if (!state.profile) return;
    try {
      const r = await api.get('/api/notices', { page: 1, size: 1, unread: true });
      state.unread = r.unread;
      renderUnread();
    } catch (e) {
      /* 忽略 */
    }
  },
  async reload() {
    await renderRoute(true);
  },
  setSub(text) {
    const el = $('#page-sub');
    if (el) el.textContent = text || '';
  },
};

/* ---------------- 登录 ---------------- */

const DEMO = [
  { label: '学生 陈嘉禾', username: '2024001' },
  { label: '学生 林知遥', username: '2024002' },
  { label: '教师 张明远', username: 'teacher001' },
  { label: '教务 周教务', username: 'academic' },
  { label: '系统 孙运维', username: 'sysadmin' },
];

function renderDemoList() {
  const box = $('#demo-list');
  box.innerHTML = DEMO.map(
    (d) => `<button type="button" data-username="${esc(d.username)}">${esc(d.label)}</button>`
  ).join('');
  box.querySelectorAll('button').forEach((b) => {
    b.onclick = () => {
      $('#login-username').value = b.dataset.username;
      $('#login-password').focus();
    };
  });
}

let captchaId = null;

async function loadCaptcha() {
  // 题目显示在刷新按钮上（按钮即题目），元素 id 为 captcha-refresh
  const btn = $('#captcha-refresh');
  if (!btn) return;
  btn.textContent = '加载中…';
  try {
    const r = await api.get('/api/auth/captcha');
    captchaId = r.captchaId;
    btn.textContent = r.question;
  } catch (e) {
    captchaId = null;
    btn.textContent = '点击重试';
  }
}

function showLogin() {
  $('#app').hidden = true;
  $('#login-page').hidden = false;
  renderDemoList();
  loadCaptcha(); // 预取验证码，登录失败需要作答时题目已就绪
  $('#login-username').focus();
}

function showApp() {
  $('#login-page').hidden = true;
  $('#app').hidden = false;
}

async function doLogin(username, password) {
  const body = { username, password };
  if (!$('#captcha-field').hidden && captchaId) {
    body.captchaId = captchaId;
    body.captchaAnswer = $('#login-captcha').value;
  }
  const r = await api.post('/api/auth/login', body);
  setToken(r.token);
  state.profile = r.profile;
}

function bindLogin() {
  $('#captcha-refresh').onclick = loadCaptcha;

  $('#login-form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('#login-submit');
    const err = $('#login-error');
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = '登录中…';
    try {
      await doLogin($('#login-username').value.trim(), $('#login-password').value);
      await boot();
    } catch (e2) {
      err.textContent = e2.message || '登录失败';
      err.hidden = false;
      if (e2 instanceof ApiError && e2.data && e2.data.needCaptcha) {
        $('#captcha-field').hidden = false;
        await loadCaptcha();
      }
    } finally {
      btn.disabled = false;
      btn.textContent = '登录';
    }
  };
}

/* ---------------- 主界面 ---------------- */

function renderNav() {
  if (!state.profile) return;
  const role = state.profile.role;
  const groups = MENUS[role] || [];
  const currentPath = getPath();
  const nav = $('#side-nav');
  nav.innerHTML = groups
    .map(
      (g) => `
      <div class="side-group-title">${esc(g.group)}</div>
      ${g.items
        .map(
          (it) => `<button class="nav-item ${it.path === currentPath ? 'active' : ''}" data-path="${esc(it.path)}">
             <span class="ni">${it.icon}</span><span>${esc(it.label)}</span>
             ${it.badge ? '<span class="ni-count" id="nav-unread" hidden></span>' : ''}
           </button>`
        )
        .join('')}`
    )
    .join('');
  nav.querySelectorAll('.nav-item').forEach((b) => {
    b.onclick = () => {
      ctx.go(b.dataset.path);
      $('#sidebar').classList.remove('open');
    };
  });
}

function renderUnread() {
  const badge = $('#unread-badge');
  const nav = $('#nav-unread');
  if (state.unread > 0) {
    badge.hidden = false;
    badge.textContent = state.unread > 99 ? '99+' : String(state.unread);
    if (nav) {
      nav.hidden = false;
      nav.textContent = String(state.unread);
    }
  } else {
    badge.hidden = true;
    if (nav) nav.hidden = true;
  }
}

function renderUser() {
  const p = state.profile;
  if (!p) return;
  $('#user-avatar').textContent = (p.realName || '?').slice(0, 1);
  $('#user-name').textContent = p.realName || p.username;
  const parts = [ROLE_TEXT[p.role]];
  if (p.studentNo) parts.push(p.studentNo);
  if (p.teacherNo) parts.push(p.teacherNo);
  if (p.grade) parts.push(p.grade + ' 级');
  $('#user-role').textContent = parts.join(' · ');

  $('#side-foot').innerHTML = `
    <div class="sf-title">当前学期</div>
    <div class="sf-value">${esc(state.term ? state.term.name : '—')}</div>`;
}

function getPath() {
  const h = window.location.hash.replace(/^#\/?/, '');
  return h || defaultPath();
}

function defaultPath() {
  const role = state.profile ? state.profile.role : 1;
  return (MENUS[role] && MENUS[role][0].items[0].path) || 'notices';
}

function findRoute(path) {
  const role = state.profile ? state.profile.role : 1;
  const groups = MENUS[role] || [];
  for (const g of groups) {
    const hit = g.items.find((i) => i.path === path);
    if (hit) return hit;
  }
  return null;
}

async function renderRoute(force = false) {
  // 未登录（含刚退出登录）时不渲染业务页面，避免残留 hash 触发空引用
  if (!state.profile) return;
  let path = getPath();
  let route = findRoute(path);
  if (!route) {
    path = defaultPath();
    route = findRoute(path);
    if (!route) return;
  }
  renderNav();
  const content = $('#content');
  content.innerHTML = loadingState();
  try {
    await route.render(content, { ...ctx, path });
  } catch (e) {
    if (e instanceof ApiError && e.code === 1002) return;
    content.innerHTML = `<div class="alert alert-error"><span class="a-ic">✕</span><span>页面加载失败：${esc(
      e.message || '未知错误'
    )}</span></div>`;
  }
}

function bindShell() {
  $('#menu-toggle').onclick = () => $('#sidebar').classList.toggle('open');
  $('#bell-btn').onclick = () => ctx.go('notices');
  $('#logout-btn').onclick = async () => {
    try {
      await api.post('/api/auth/logout');
    } catch (e) {
      /* 忽略 */
    }
    setToken('');
    state.profile = null;
    window.location.hash = '';
    showLogin();
  };
  window.addEventListener('hashchange', () => renderRoute());
  window.addEventListener('cs:unauthorized', () => {
    state.profile = null;
    showLogin();
    toast('登录状态已失效，请重新登录', 'warn');
  });
}

/* ---------------- 启动 ---------------- */

async function boot() {
  if (!state.profile) {
    const me = await api.get('/api/auth/me');
    state.profile = me.profile;
    state.unread = me.unreadNotice;
  }
  const t = await api.get('/api/terms/current');
  state.term = t.current;
  state.terms = t.terms;
  state.filters = await api.get('/api/meta/filters');

  $('#term-chip').textContent = state.term ? `${state.term.name}` : '未设置学期';
  renderUser();
  showApp();
  if (!window.location.hash) window.location.hash = '#/' + defaultPath();
  await renderRoute();
  renderUnread();
  await ctx.refreshUnread();
}

async function main() {
  bindLogin();
  bindShell();
  if (getToken()) {
    try {
      await boot();
      return;
    } catch (e) {
      setToken('');
    }
  }
  showLogin();
}

main();
