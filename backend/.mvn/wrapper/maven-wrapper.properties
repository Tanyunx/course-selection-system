# Maven Wrapper 配置
#
# 作用：让「没装 Maven 的机器」也能直接 ./mvnw 构建，无需先 apt install maven。
#       云服务器（Ubuntu 学生机）与本地 VS Code 共用同一份配置，构建行为一致。
#
# distributionUrl 刻意指向阿里云镜像：
#   官方源 repo.maven.apache.org 在国内经常几十 KB/s 甚至超时，
#   换成国内镜像后通常几秒内完成。
# 若某天镜像不可用，可临时改回官方地址：
#   https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip

wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://maven.aliyun.com/repository/public/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
